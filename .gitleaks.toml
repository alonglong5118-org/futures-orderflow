# ==============================================================================
#  Gitleaks 配置
# ==============================================================================
#  用于密钥泄露检测的规则和白名单配置
#  文档：https://github.com/gitleaks/gitleaks
# ==============================================================================

[allowlist]
  # 描述性的描述字段，不是真实密钥
  description = "全局白名单：测试文件中的 baseline key、配置文件中的非敏感 key"

  # 按正则匹配的误报（这些不是真实密钥）
  regexes = [
    # 测试文件中的 baseline key（如 dq_normal_3symbols, dq_mixed_3symbols）
    '''key\s*=\s*"dq_''',
    # 字典 key 赋值模式（测试和配置中常见，不是密钥）
    '''key\s*=\s*"[a-z_]+_\d+symbols"''',
  ]

  # 完全跳过的路径（测试数据、配置示例等不含真实密钥的文件）
  paths = [
    # 测试基线文件（存的是测试期望值，不是密钥）
    '''tests/_baseline_values\.json''',
    '''tests/_perf_baseline\.json''',
    # 功能开关和校准参数（公开配置，不是密钥）
    '''feature_flags\.json''',
    '''calibration_params\.json''',
    '''stop_rr_overrides\.json''',
    # 文档
    '''docs/''',
    # CI 配置本身
    '''\.github/''',
  ]
