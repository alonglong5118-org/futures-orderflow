<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三感参谋 · 实盘账户仪表盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0e1a;
    color: #e0e6f0;
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid #1e2a4a;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 600;
    background: linear-gradient(135deg, #4fc3f7, #7c4dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header h1 .sub {
    font-size: 13px;
    font-weight: 400;
    color: #8892b0;
    -webkit-text-fill-color: #8892b0;
    margin-left: 10px;
  }
  .status-bar {
    display: flex;
    gap: 15px;
    align-items: center;
    font-size: 13px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4caf50;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .status-time { color: #8892b0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
  }
  .card {
    background: #111827;
    border: 1px solid #1e2a4a;
    border-radius: 10px;
    padding: 16px;
  }
  .card .label { font-size: 12px; color: #8892b0; margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 600; }
  .value.up { color: #f44336; }
  .value.down { color: #4caf50; }

  .two-col {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #b8c5e0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: "";
    width: 3px; height: 14px;
    background: linear-gradient(180deg, #4fc3f7, #7c4dff);
    border-radius: 2px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 10px 12px;
    color: #8892b0;
    font-weight: 500;
    font-size: 12px;
    border-bottom: 1px solid #1e2a4a;
  }
  td {
    padding: 12px;
    border-bottom: 1px solid #151d30;
  }
  tr:hover { background: #151d30; }
  .pnl-positive { color: #f44336; }
  .pnl-negative { color: #4caf50; }
  .direction-long { color: #f44336; }
  .direction-short { color: #4caf50; }

  .risk-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .risk-bar .name { font-size: 12px; color: #8892b0; width: 80px; }
  .risk-bar .track {
    flex: 1;
    height: 6px;
    background: #1e2a4a;
    border-radius: 3px;
    overflow: hidden;
  }
  .risk-bar .fill {
    height: 100%;
    border-radius: 3px;
    transition: width .3s;
  }
  .risk-bar .pct { font-size: 12px; color: #b8c5e0; width: 50px; text-align: right; }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #1e2a4a;
    background: #111827;
    color: #e0e6f0;
    cursor: pointer;
    font-size: 12px;
    transition: all .2s;
  }
  .btn:hover { background: #1e2a4a; border-color: #4fc3f7; }
  .btn-primary { background: linear-gradient(135deg, #4fc3f7, #7c4dff); border: none; color: #fff; }
  .btn-danger { background: rgba(244,67,54,.15); border-color: #f44336; color: #f44336; }
  .btn-success { background: rgba(76,175,80,.15); border-color: #4caf50; color: #4caf50; }

  .trade-form {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #1e2a4a;
  }
  .trade-form input, .trade-form select {
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid #1e2a4a;
    background: #0a0e1a;
    color: #e0e6f0;
    font-size: 12px;
  }
  .trade-form input:focus, .trade-form select:focus { outline: none; border-color: #4fc3f7; }
  .trade-form .full { grid-column: span 3; }

  .account-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    background: rgba(79,195,247,.1);
    border: 1px solid rgba(79,195,247,.3);
    color: #4fc3f7;
  }

  .strategy-info {
    margin-top: 10px;
    padding: 10px;
    background: #0d1424;
    border-radius: 6px;
    font-size: 12px;
    color: #8892b0;
    line-height: 1.6;
  }
  .strategy-info strong { color: #b8c5e0; }

  .footer {
    text-align: center;
    color: #5a6378;
    font-size: 11px;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #1e2a4a;
  }

  @media (max-width: 1200px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>三感参谋 <span class="sub">TriSense Advisor · 实盘跟踪账户</span></h1>
  <div class="status-bar">
    <span class="account-badge">● 实盘账户</span>
    <span class="status-dot"></span>
    <span id="statusText">运行中</span>
    <span class="status-time" id="lastUpdate">--</span>
  </div>
</div>

<!-- 账户概览 -->
<div class="grid">
  <div class="card">
    <div class="label">账户权益</div>
    <div class="value" id="equity">--</div>
  </div>
  <div class="card">
    <div class="label">可用资金</div>
    <div class="value" id="cash">--</div>
  </div>
  <div class="card">
    <div class="label">今日盈亏</div>
    <div class="value" id="dailyPnl">--</div>
  </div>
  <div class="card">
    <div class="label">持仓数量</div>
    <div class="value" id="posCount">0</div>
  </div>
</div>

<!-- 主内容 -->
<div class="two-col">
  <!-- 持仓表 -->
  <div class="card">
    <div class="section-title">实盘持仓</div>
    <table id="positionsTable">
      <thead>
        <tr>
          <th>品种</th>
          <th>方向</th>
          <th>手数</th>
          <th>开仓价</th>
          <th>最新价</th>
          <th>浮盈/亏</th>
          <th>收益率</th>
          <th>止损</th>
          <th>止盈</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="9" style="text-align:center;color:#5a6378;padding:30px;">暂无持仓</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 风控概览 -->
  <div class="card">
    <div class="section-title">五层风控状态</div>
    <div class="risk-bar">
      <span class="name">账户使用率</span>
      <div class="track"><div class="fill" id="usageBar" style="width:0%;background:linear-gradient(90deg,#4fc3f7,#4caf50)"></div></div>
      <span class="pct" id="usagePct">0%</span>
    </div>
    <div class="risk-bar">
      <span class="name">单笔风险</span>
      <div class="track"><div class="fill" style="width:0%;background:linear-gradient(90deg,#4fc3f7,#4caf50)"></div></div>
      <span class="pct">--</span>
    </div>
    <div class="risk-bar">
      <span class="name">相关性</span>
      <div class="track"><div class="fill" style="width:0%;background:linear-gradient(90deg,#4fc3f7,#ff9800)"></div></div>
      <span class="pct">--</span>
    </div>
    <div class="risk-bar">
      <span class="name">最大回撤</span>
      <div class="track"><div class="fill" style="width:0%;background:linear-gradient(90deg,#4caf50,#f44336)"></div></div>
      <span class="pct">--</span>
    </div>
    <div class="risk-bar">
      <span class="name">熔断状态</span>
      <div class="track"><div class="fill" style="width:0%;background:#4caf50"></div></div>
      <span class="pct">正常</span>
    </div>

    <div class="strategy-info">
      <strong>账户类型：</strong>实盘跟踪账户<br>
      <strong>策略模式：</strong>手动管理（不跟随自动信号）<br>
      <strong>启用功能：</strong>TP/SL 自动止盈止损、移动止损、五层风控监控
    </div>
  </div>
</div>

<!-- 手动交易面板 -->
<div class="card">
  <div class="section-title">手动开仓 / 平仓</div>
  <div class="controls">
    <button class="btn btn-primary" onclick="toggleForm('open')">手动开仓</button>
    <button class="btn btn-danger" onclick="toggleForm('close')">手动平仓</button>
    <button class="btn" onclick="resetAccount()">重置账户</button>
  </div>
  <div class="trade-form" id="openForm" style="display:none;">
    <input type="text" id="openSymbol" placeholder="品种代码（如 SA701）">
    <select id="openDirection">
      <option value="多">多</option>
      <option value="空">空</option>
    </select>
    <input type="number" id="openLots" placeholder="手数">
    <input type="number" step="0.01" id="openPrice" placeholder="开仓价格">
    <input type="number" step="0.01" id="openStop" placeholder="止损价（可选）">
    <input type="number" step="0.01" id="openTarget" placeholder="止盈价（可选）">
    <button class="btn btn-success full" onclick="manualOpen()">确认开仓</button>
  </div>
  <div class="trade-form" id="closeForm" style="display:none;">
    <input type="text" id="closeSymbol" placeholder="品种代码">
    <input type="number" step="0.01" id="closePrice" placeholder="平仓价格">
    <input type="number" id="closeLots" placeholder="平仓手数（留空=全平）">
    <button class="btn btn-danger full" onclick="manualClose()">确认平仓</button>
  </div>
</div>

<div class="footer">
  三感参谋（TriSense Advisor）· 实盘跟踪账户 · 数据仅用于策略参谋辅助，不构成投资建议
</div>

<script>
const API = "/api/trisense-replay";
let state = null;

async function fetchState() {
  try {
    const r = await fetch(API);
    state = await r.json();
    updateUI();
    document.getElementById("statusText").textContent = "运行中";
    document.getElementById("lastUpdate").textContent = new Date().toLocaleTimeString("zh-CN");
  } catch (e) {
    document.getElementById("statusText").textContent = "连接失败";
  }
}

function updateUI() {
  if (!state) return;

  const eq = state.equity || state.cash || 0;
  const cash = state.cash || 0;
  const positions = state.positions || [];
  const dailyPnl = state.daily_pnl || 0;

  document.getElementById("equity").textContent = formatNum(eq);
  document.getElementById("cash").textContent = formatNum(cash);
  document.getElementById("posCount").textContent = positions.length;

  const pnlEl = document.getElementById("dailyPnl");
  pnlEl.textContent = (dailyPnl >= 0 ? "+" : "") + formatNum(dailyPnl);
  pnlEl.className = "value " + (dailyPnl >= 0 ? "up" : "down");

  // 使用率
  const margin = eq - cash;
  const usage = eq > 0 ? (margin / eq * 100) : 0;
  document.getElementById("usagePct").textContent = usage.toFixed(1) + "%";
  document.getElementById("usageBar").style.width = Math.min(usage, 100) + "%";

  // 持仓表
  const tbody = document.querySelector("#positionsTable tbody");
  if (positions.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#5a6378;padding:30px;">暂无持仓</td></tr>';
  } else {
    tbody.innerHTML = positions.map(p => {
      const pnl = p.unrealized_pnl || 0;
      const pnlClass = pnl >= 0 ? "pnl-positive" : "pnl-negative";
      const dirClass = p.direction === "多" ? "direction-long" : "direction-short";
      const retPct = p.entry_price ? (pnl / (p.entry_price * p.lots * 10) * 100).toFixed(2) : "--";
      return `<tr>
        <td>${p.symbol}</td>
        <td class="${dirClass}">${p.direction}</td>
        <td>${p.lots}</td>
        <td>${p.entry_price || "--"}</td>
        <td>${p.current_price || "--"}</td>
        <td class="${pnlClass}">${pnl >= 0 ? "+" : ""}${formatNum(pnl)}</td>
        <td class="${pnlClass}">${retPct}%</td>
        <td>${p.stop_loss || "--"}</td>
        <td>${p.take_profit || "--"}</td>
      </tr>`;
    }).join("");
  }
}

function formatNum(n) {
  if (n == null) return "--";
  return Number(n).toLocaleString("zh-CN", { maximumFractionDigits: 2 });
}

function toggleForm(type) {
  const openF = document.getElementById("openForm");
  const closeF = document.getElementById("closeForm");
  if (type === "open") {
    openF.style.display = openF.style.display === "none" ? "grid" : "none";
    closeF.style.display = "none";
  } else {
    closeF.style.display = closeF.style.display === "none" ? "grid" : "none";
    openF.style.display = "none";
  }
}

async function manualOpen() {
  const symbol = document.getElementById("openSymbol").value.trim().toUpperCase();
  const direction = document.getElementById("openDirection").value;
  const lots = parseInt(document.getElementById("openLots").value);
  const price = parseFloat(document.getElementById("openPrice").value);
  const stop = document.getElementById("openStop").value;
  const target = document.getElementById("openTarget").value;

  if (!symbol || !lots || !price) { alert("请填写品种、手数和价格"); return; }

  const body = {
    action: "open",
    symbol, direction, lots, price,
    stop: stop ? parseFloat(stop) : null,
    target: target ? parseFloat(target) : null,
  };

  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await r.json();
  if (data.ok) {
    alert("开仓成功");
    toggleForm("open");
    fetchState();
  } else {
    alert("开仓失败：" + (data.msg || data.error));
  }
}

async function manualClose() {
  const symbol = document.getElementById("closeSymbol").value.trim().toUpperCase();
  const price = parseFloat(document.getElementById("closePrice").value);
  const lots = document.getElementById("closeLots").value;

  if (!symbol || !price) { alert("请填写品种和平仓价格"); return; }

  const body = {
    action: "close",
    symbol, price,
    lots: lots ? parseInt(lots) : null,
    reason: "手动平仓"
  };

  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await r.json();
  if (data.ok) {
    alert("平仓成功");
    toggleForm("close");
    fetchState();
  } else {
    alert("平仓失败：" + (data.msg || data.error));
  }
}

async function resetAccount() {
  if (!confirm("确定要重置账户吗？所有持仓和交易记录将被清空。")) return;
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "reset", init_cash: 98147 })
  });
  const data = await r.json();
  if (data.ok) {
    alert("账户已重置");
    fetchState();
  }
}

// 启动
fetchState();
setInterval(fetchState, 3000);
</script>
</body>
</html>
