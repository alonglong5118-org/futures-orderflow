<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Futures OrderFlow Social Card">
  <defs>
    <!-- 背景渐变：深蓝 → 靛蓝 -->
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <!-- 主色渐变 -->
    <linearGradient id="scPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <!-- 文字渐变 -->
    <linearGradient id="scTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#f9a8d4" />
    </linearGradient>
    <!-- 光晕效果 -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <!-- 上涨绿 -->
    <linearGradient id="bull" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <!-- 下跌红 -->
    <linearGradient id="bear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#scBg)" />

  <!-- 光晕装饰 -->
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- 网格线（背景装饰） -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <!-- 横线 -->
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <!-- 竖线 -->
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!--
    右侧 K 线图装饰（大尺寸，半透明）
  -->
  <g transform="translate(720, 140)" opacity="0.6">
    <!-- 趋势线 -->
    <path d="M 0 300 Q 80 260 160 200 Q 240 140 320 80 Q 380 40 420 60"
          fill="none" stroke="url(#scPrimary)" stroke-width="3" stroke-linecap="round" />

    <!-- K 线组 -->
    <g>
      <!-- 阳 -->
      <line x1="30" y1="280" x2="30" y2="330" stroke="url(#bull)" stroke-width="2" />
      <rect x="22" y="295" width="16" height="25" rx="2" fill="url(#bull)" />

      <!-- 阳 -->
      <line x1="80" y1="240" x2="80" y2="310" stroke="url(#bull)" stroke-width="2" />
      <rect x="72" y="260" width="16" height="35" rx="2" fill="url(#bull)" />

      <!-- 阳 -->
      <line x1="130" y1="180" x2="130" y2="260" stroke="url(#bull)" stroke-width="2" />
      <rect x="122" y="200" width="16" height="45" rx="2" fill="url(#bull)" />

      <!-- 阴 -->
      <line x1="180" y1="150" x2="180" y2="230" stroke="url(#bear)" stroke-width="2" />
      <rect x="172" y="160" width="16" height="50" rx="2" fill="url(#bear)" />

      <!-- 阳 -->
      <line x1="230" y1="100" x2="230" y2="190" stroke="url(#bull)" stroke-width="2" />
      <rect x="222" y="120" width="16" height="55" rx="2" fill="url(#bull)" />

      <!-- 阳（最高） -->
      <line x1="280" y1="50" x2="280" y2="150" stroke="url(#scPrimary)" stroke-width="2.5" />
      <rect x="270" y="70" width="20" height="65" rx="3" fill="url(#scPrimary)" />

      <!-- 阴（回调） -->
      <line x1="330" y1="70" x2="330" y2="160" stroke="url(#bear)" stroke-width="2" />
      <rect x="322" y="85" width="16" height="55" rx="2" fill="url(#bear)" />

      <!-- 阳 -->
      <line x1="380" y1="60" x2="380" y2="140" stroke="url(#bull)" stroke-width="2" />
      <rect x="372" y="75" width="16" height="50" rx="2" fill="url(#bull)" />
    </g>

    <!-- 成交量柱 -->
    <g opacity="0.4">
      <rect x="25" y="360" width="10" height="18" rx="2" fill="#6366f1" />
      <rect x="75" y="352" width="10" height="26" rx="2" fill="#8b5cf6" />
      <rect x="125" y="345" width="10" height="33" rx="2" fill="#a78bfa" />
      <rect x="175" y="348" width="10" height="30" rx="2" fill="#ec4899" />
      <rect x="225" y="340" width="10" height="38" rx="2" fill="#8b5cf6" />
      <rect x="273" y="330" width="14" height="48" rx="2" fill="url(#scPrimary)" />
      <rect x="325" y="342" width="10" height="36" rx="2" fill="#f472b6" />
      <rect x="375" y="346" width="10" height="32" rx="2" fill="#a78bfa" />
    </g>
  </g>

  <!--
    左侧文字内容
  -->
  <g transform="translate(80, 180)">
    <!-- 标签 -->
    <rect x="0" y="0" width="180" height="36" rx="18" ry="18"
          fill="none" stroke="url(#scPrimary)" stroke-width="1.5" opacity="0.8" />
    <text x="90" y="24" text-anchor="middle"
          font-family="'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="14" font-weight="600" fill="url(#scTextGrad)" letter-spacing="3">
      ORDERFLOW · 订单流
    </text>

    <!-- 主标题 -->
    <text x="0" y="110"
          font-family="'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="64" font-weight="800" fill="#ffffff">
      Futures
    </text>
    <text x="0" y="180"
          font-family="'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="64" font-weight="800" fill="url(#scPrimary)">
      OrderFlow
    </text>

    <!-- 副标题 -->
    <text x="0" y="235"
          font-family="'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="22" font-weight="400" fill="#94a3b8">
      基于订单流数据的多维度期货量化交易策略框架
    </text>

    <!-- 分隔线 -->
    <line x1="0" y1="280" x2="300" y2="280" stroke="url(#scPrimary)" stroke-width="2" opacity="0.5" />

    <!-- 特性标签 -->
    <g transform="translate(0, 310)">
      <g>
        <rect x="0" y="0" width="100" height="32" rx="16" ry="16" fill="rgba(99,102,241,0.15)" stroke="#6366f1" stroke-width="1" />
        <text x="50" y="21" text-anchor="middle" font-size="13" font-weight="500" fill="#a5b4fc"
              font-family="'SF Pro Text', 'PingFang SC', sans-serif">
          四维策略
        </text>
      </g>
      <g transform="translate(110, 0)">
        <rect x="0" y="0" width="100" height="32" rx="16" ry="16" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1" />
        <text x="50" y="21" text-anchor="middle" font-size="13" font-weight="500" fill="#c4b5fd"
              font-family="'SF Pro Text', 'PingFang SC', sans-serif">
          风控体系
        </text>
      </g>
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="110" height="32" rx="16" ry="16" fill="rgba(236,72,153,0.15)" stroke="#ec4899" stroke-width="1" />
        <text x="55" y="21" text-anchor="middle" font-size="13" font-weight="500" fill="#f9a8d4"
              font-family="'SF Pro Text', 'PingFang SC', sans-serif">
          订单流分析
        </text>
      </g>
    </g>
  </g>

  <!-- 底部信息 -->
  <g transform="translate(80, 570)">
    <text x="0" y="0"
          font-family="'SF Mono', 'Roboto Mono', monospace"
          font-size="14" font-weight="500" fill="#64748b" letter-spacing="1">
      github.com/alonglong5118-org/futures-orderflow
    </text>
  </g>
</svg>
