  <style>
    :root {
      --bg: #0a0e1a;
      --bg2: #131a2e;

      --muted: #8896b0;
      --rule: #2a3a5c;
      --accent: #3b82f6;
      --accent2: #8b5cf6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --font: 'InstrumentSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrainsMono', 'SF Mono', Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* === Header === */
    .dashboard-header {
      background: linear-gradient(135deg, var(--bg2) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--rule);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .dashboard-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .dashboard-header h1 .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .header-actions .status-label {
      font-size: 0.8rem;

    }

      font-size: 0.75rem;
      color: var(--muted);
    }

    /* === Buttons === */
    .btn {
      padding: 0.5rem 1rem;
      border: 1px solid var(--rule);
      background: var(--bg2);
      color: var(--ink);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: var(--font);
      transition: all 0.15s;
    }
    .btn:hover {
      border-color: var(--accent);
      background: var(--bg3);
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .btn.primary:hover {

    }
    .btn.danger {
      background: var(--danger);

      padding: 0.3rem 0.7rem;

    }

    .toggle {

      width: 44px;
      height: 24px;

      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid var(--rule);
    }
    .toggle.active {
      background: var(--success);
      border-color: var(--success);
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      transition: left 0.2s;
    }
    .toggle.active::after {
      left: 22px;
    }

    /* === Main Layout === */
    .dashboard-main {
      padding: 1.25rem;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* === Metric Cards === */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .metric-card {

      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 1.1rem;
      position: relative;
      overflow: hidden;
    }
    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--accent);
    }
    .metric-card.success::before { background: var(--success); }
    .metric-card.danger::before { background: var(--danger); }
    .metric-card.warning::before { background: var(--warning); }
    .metric-card .label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }
    .metric-card .value {
      font-size: 1.75rem;
      font-weight: 700;
      font-family: var(--font-mono);
      line-height: 1.2;
    }
    .metric-card .value.positive { color: var(--success); }
    .metric-card .value.negative { color: var(--danger); }
    .metric-card .sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* === Grid Layout === */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .dashboard-grid .col-full {
      grid-column: 1 / -1;
    }
    @media (max-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    /* === Panel === */
    .panel {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 10px;
      overflow: hidden;
    }
    .panel-header {
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-header h3 {
      font-size: 0.95rem;
      font-weight: 700;
    }
    .panel-header .panel-tools {
      display: flex;
      gap: 0.5rem;
    }
    .panel-body {
      padding: 1rem;
    }

    /* === Positions Table === */
    .positions-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .positions-table th {
      text-align: left;
      padding: 0.6rem 0.75rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 2px solid var(--rule);
      white-space: nowrap;
    }
    .positions-table td {
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--rule);
      white-space: nowrap;
    }
    .positions-table tbody tr:hover {
      background: var(--bg3);
    }
    .positions-table .sym {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.9rem;
    }
    .positions-table .dir-long { color: var(--success); font-weight: 600; }
    .positions-table .dir-short { color: var(--danger); font-weight: 600; }
    .positions-table .mono {
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }
    .positions-table .pnl-pos { color: var(--success); font-weight: 600; }
    .positions-table .pnl-neg { color: var(--danger); font-weight: 600; }

    .position-bars {
      display: flex;
      gap: 2px;
      align-items: center;
    }
    .position-bar {
      width: 24px;
      height: 6px;
      border-radius: 2px;
      background: var(--bg3);
      position: relative;
      overflow: hidden;
    }
    .position-bar .fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 2px;
    }
    .position-bar .fill.stop { left: 0; width: 50%; background: var(--danger); opacity: 0.3; }
    .position-bar .fill.entry { left: 50%; width: 2px; background: var(--muted); }
    .position-bar .fill.target { right: 0; width: 50%; background: var(--success); opacity: 0.3; }

    /* === Trades Table === */
    .trades-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .trades-table th {
      text-align: left;
      padding: 0.5rem 0.7rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 2px solid var(--rule);
      white-space: nowrap;
    }
    .trades-table td {
      padding: 0.5rem 0.7rem;
      border-bottom: 1px solid var(--rule);
      white-space: nowrap;
    }
    .trades-table tbody tr:hover {
      background: var(--bg3);
    }
    .trades-table .mono {
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }
    .trades-table .time {
      color: var(--muted);
      font-size: 0.78rem;
    }
    .trades-table .reason-tag {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .reason-win { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .reason-loss { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

    .table-wrap {
      overflow-x: auto;
      max-height: 420px;
      overflow-y: auto;
    }
    .table-wrap thead th {
      position: sticky;
      top: 0;
      background: var(--bg2);
      z-index: 1;
    }

    /* === Chart === */
    .chart-container {
      width: 100%;
      min-height: 280px;
    }

    /* === Empty State === */
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
    }
    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      opacity: 0.5;
    }
    .empty-state p {
      font-size: 0.9rem;
    }

    /* === Config Panel === */
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .config-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--rule);
    }
    .config-item:last-child { border-bottom: none; }
    .config-item label {
      font-size: 0.82rem;
      color: var(--muted);
    }
    .config-item input[type="number"] {
      width: 70px;
      background: var(--bg);
      border: 1px solid var(--rule);
      color: var(--ink);
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-align: right;
    }

    /* === Loading === */
    .loading {
      opacity: 0.5;
      pointer-events: none;
    }

    /* === Responsive === */
    @media (max-width: 768px) {
      .dashboard-header {
        flex-direction: column;
        gap: 0.75rem;
        align-items: flex-start;

<body>
  <header class="dashboard-header">
    <h1>
      <span class="dot" id="status-dot"></span>
      模拟交易仪表盘
      <span style="font-size: 0.75rem; color: var(--muted); font-weight: 400; margin-left: 0.5rem;">Paper Trading</span>
    </h1>
    <div class="header-actions">
      <span class="status-label">自动交易</span>
      <div class="toggle active" id="auto-toggle" title="点击开关自动模拟交易"></div>
      <span class="updated-time" id="updated-time">--:--:--</span>
      <button class="btn small" id="refresh-btn">刷新</button>
    </div>
  </header>

  <main class="dashboard-main">
    <!-- 指标卡片 -->
    <div class="metrics-grid" id="metrics-grid">
      <!-- 动态填充 -->
    </div>

    <!-- 第一行：权益曲线 + 统计 -->
    <div class="dashboard-grid">
      <div class="panel">
        <div class="panel-header">
          <h3>📈 权益曲线</h3>
          <div class="panel-tools">
            <select class="btn small" id="chart-range">
              <option value="all">全部</option>
              <option value="30">近30天</option>
              <option value="7">近7天</option>
            </select>
          </div>
        </div>
        <div class="panel-body">
          <div class="chart-container" id="chart-equity"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h3>📊 交易统计</h3>
        </div>
        <div class="panel-body" id="stats-panel">
          <!-- 动态填充 -->
        </div>
      </div>
    </div>

    <!-- 第二行：持仓 + 交易记录 -->
    <div class="dashboard-grid">
      <div class="panel">
        <div class="panel-header">
          <h3>💼 当前持仓</h3>
          <div class="panel-tools">
            <span class="status-label" id="position-count">0 个持仓</span>
          </div>
        </div>
        <div class="table-wrap" id="positions-wrap">
          <table class="positions-table">
            <thead>
              <tr>
                <th>品种</th>
                <th>方向</th>
                <th>手数</th>
                <th>开仓价</th>
                <th>当前价</th>
                <th>止损</th>
                <th>止盈</th>
                <th>浮动盈亏</th>
                <th>R 盈亏</th>
                <th>进度</th>
              </tr>
            </thead>
            <tbody id="positions-tbody">
              <tr><td colspan="10"><div class="empty-state"><div class="icon">📭</div><p>暂无持仓</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h3>⚙️ 配置</h3>
          <button class="btn small" id="save-config-btn">保存</button>
        </div>
        <div class="panel-body">
          <div class="config-grid" id="config-grid">
            <div class="config-item">
              <label>最大持仓数</label>
              <input type="number" id="cfg-max-pos" value="8" min="1" max="20">
            </div>
            <div class="config-item">
              <label>单笔最大手数</label>
              <input type="number" id="cfg-max-lots" value="5" min="1" max="20">
            </div>
            <div class="config-item">
              <label>默认手数</label>
              <input type="number" id="cfg-default-lots" value="1" min="1" max="10">
            </div>
            <div class="config-item">
              <label>冷却期(分钟)</label>
              <input type="number" id="cfg-cooldown" value="30" min="0" max="240">
            </div>
            <div class="config-item">
              <label>启用移动止损</label>
              <div class="toggle active" id="cfg-trailing"></div>
            </div>
            <div class="config-item">
              <label>移动止损锁定(R)</label>
              <input type="number" id="cfg-trailing-lock" value="0.5" min="0.1" max="2" step="0.1">
            </div>
          </div>
          <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--rule);">
            <button class="btn danger small" id="reset-btn" style="width: 100%;">重置模拟账户</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 第三行：交易历史 -->
    <div class="panel col-full">
      <div class="panel-header">
        <h3>📜 交易记录</h3>
        <div class="panel-tools">
          <select class="btn small" id="trade-filter">
            <option value="all">全部</option>
            <option value="close">已平仓</option>
            <option value="open">开仓记录</option>
          </select>
        </div>
      </div>
      <div class="table-wrap" style="max-height: 500px;">
        <table class="trades-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>品种</th>
              <th>方向</th>
              <th>类型</th>
              <th>手数</th>
              <th>开仓价</th>
              <th>平仓价</th>
              <th>盈亏</th>
              <th>R 盈亏</th>
              <th>原因</th>
            </tr>
          </thead>
          <tbody id="trades-tbody">
            <tr><td colspan="10"><div class="empty-state"><div class="icon">📝</div><p>暂无交易记录</p></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="./_shared/js/echarts.min.js"></script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
