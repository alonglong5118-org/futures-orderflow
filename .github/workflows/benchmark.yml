# ==============================================================================
#  CI：性能基准测试
# ==============================================================================
#  触发时机：
#    · push 到 main/master → 自动跑一次，更新基线缓存
#    · 手动触发（workflow_dispatch）→ 按需跑
#    · PR 不自动触发（性能测试慢，且 CI 环境波动大）
#
#  功能：
#    · 运行 15 项性能基准
#    · 与历史基线对比，检测性能退化
#    · 生成 JSON + Markdown 报告，上传为 artifact
#    · 退化超过 50% 标记为失败（严格模式）
# ==============================================================================

name: Benchmark

run-name: "Benchmark · ${{ github.event_name == 'push' && github.event.head_commit.message || github.event_name }}"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      strict:
        description: "严格模式（退化超阈值则失败）"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# 并发控制：同一分支只保留最新一次基准测试
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：只授予必要的 GITHUB_TOKEN 权限
permissions:
  contents: read      # 代码检出
  actions: write      # 缓存读写（性能基线缓存）

jobs:
  benchmark:
    name: "Performance Benchmark"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Restore baseline cache
        id: baseline-cache
        uses: actions/cache/restore@v5
        with:
          path: tests/_perf_baseline.json
          key: perf-baseline-${{ github.sha }}
          restore-keys: |
            perf-baseline-

      - name: Show baseline info
        run: |
          if [ -f tests/_perf_baseline.json ]; then
            echo "✅ 已加载性能基线"
            python -c "import json; d=json.load(open('tests/_perf_baseline.json')); print(f'  共 {len(d)} 项基线')"
          else
            echo "⚠️  无历史基线，本次运行将建立初始基线"
          fi

      - name: Run performance benchmarks
        id: bench
        env:
          PERF_CHECK: ${{ github.event.inputs.strict || 'true' }}
          PERF_RESULTS_FILE: benchmark-results/results.json
        run: |
          mkdir -p benchmark-results
          python -m tests.test_performance

      - name: Generate benchmark report
        if: always()
        run: |
          python scripts/gen_benchmark_report.py

      - name: Save baseline to cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: tests/_perf_baseline.json
          key: perf-baseline-${{ github.sha }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-report
          path: benchmark-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-junit
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
