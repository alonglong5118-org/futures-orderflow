# ==============================================================================
#  CI：性能基准测试
# ==============================================================================
#  触发时机：
#    · push 到 main/master → 自动跑一次，更新基线缓存
#    · 手动触发（workflow_dispatch）→ 按需跑
#    · PR 不自动触发（性能测试慢，且 CI 环境波动大）
#
#  功能：
#    · 运行 15 项性能基准
#    · 与历史基线对比，检测性能退化
#    · 生成 JSON + Markdown 报告，上传为 artifact
#    · 退化超过 50% 标记为失败
# ==============================================================================

name: Benchmark

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      strict:
        description: "严格模式（退化超阈值则失败）"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  benchmark:
    name: "Performance Benchmark"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Restore baseline cache
        id: baseline-cache
        uses: actions/cache/restore@v4
        with:
          path: tests/_perf_baseline.json
          key: perf-baseline-${{ github.sha }}
          restore-keys: |
            perf-baseline-

      - name: Show baseline info
        run: |
          if [ -f tests/_perf_baseline.json ]; then
            echo "✅ 已加载性能基线"
            python -c "
import json
with open('tests/_perf_baseline.json') as f:
    data = json.load(f)
print(f'  共 {len(data)} 项基线')
for k, v in sorted(data.items()):
    print(f'  {k:30s} {v:10.4f}ms')
"
          else
            echo "⚠️  无历史基线，本次运行将建立初始基线"
          fi

      - name: Run performance benchmarks
        id: bench
        env:
          PERF_CHECK: ${{ github.event.inputs.strict || 'true' }}
        run: |
          python run_tests.py performance --py-only --junit test-results/benchmark.xml
        continue-on-error: false

      - name: Generate benchmark report
        if: always()
        run: |
          python - <<'PYEOF'
import json
import os
import sys

HERE = os.path.dirname(os.path.abspath(__file__))
ROOT = HERE
sys.path.insert(0, ROOT)

# 从测试输出中提取性能数据（从 _perf_results 和 _perf_baselines）
# 这里直接从 baseline 文件和测试结果构建报告
baseline_file = os.path.join(ROOT, "tests", "_perf_baseline.json")
result_file = os.path.join(ROOT, "tests", "_perf_baseline.json")  # 当前结果已写入

# 尝试导入测试模块获取最新结果
sys.path.insert(0, os.path.join(ROOT, "tests"))
try:
    from test_performance import _perf_results, _perf_baselines, PERF_REGRESSION_THRESHOLD
except ImportError:
    _perf_results = {}
    _perf_baselines = {}
    PERF_REGRESSION_THRESHOLD = 0.5

# 加载基线
if os.path.exists(baseline_file):
    with open(baseline_file) as f:
        _perf_baselines = json.load(f)

# 生成 Markdown 报告
lines = []
lines.append("# 性能基准测试报告")
lines.append("")
lines.append(f"| 指标 | 当前 (ms) | 基线 (ms) | 变化 | 状态 |")
lines.append(f"|------|-----------|-----------|------|------|")

regressions = 0
improvements = 0
total = len(_perf_results)

for name in sorted(_perf_results.keys()):
    avg_ms = _perf_results[name]
    baseline = _perf_baselines.get(name)

    if baseline and baseline > 0:
        delta_pct = (avg_ms / baseline - 1) * 100
        delta_str = f"{delta_pct:+.1f}%"
        if delta_pct > PERF_REGRESSION_THRESHOLD * 100:
            status = "🔴 退化"
            regressions += 1
        elif delta_pct < -PERF_REGRESSION_THRESHOLD * 100:
            status = "🟢 提升"
            improvements += 1
        else:
            status = "✅ 正常"
    else:
        delta_str = "—"
        status = "🆕 新增"

    lines.append(f"| {name} | {avg_ms:.4f} | {baseline:.4f}" if baseline else f"| {name} | {avg_ms:.4f} | —")
    lines[-1] += f" | {delta_str} | {status} |"

lines.append("")
lines.append(f"**共 {total} 项基准** · 🔴 退化 {regressions} 项 · 🟢 提升 {improvements} 项")

# 保存报告
os.makedirs("benchmark-results", exist_ok=True)
with open("benchmark-results/report.md", "w") as f:
    f.write("\n".join(lines))

# 保存 JSON 结果
with open("benchmark-results/results.json", "w") as f:
    json.dump(_perf_results, f, indent=2)

print(f"\n报告已生成：{total} 项基准，{regressions} 项退化，{improvements} 项提升")
PYEOF

      - name: Save baseline to cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: tests/_perf_baseline.json
          key: perf-baseline-${{ github.sha }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-results/
          if-no-files-found: ignore

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-junit
          path: test-results/
          if-no-files-found: ignore
