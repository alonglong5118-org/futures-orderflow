# ==============================================================================
#  CI：SBOM — 软件物料清单
# ==============================================================================
#  触发时机：
#    · push 到 main/master → 生成 SBOM + 漏洞扫描 + 上传 Dependency Graph
#    · 手动触发
#
#  注意：Release 发布时的 SBOM 生成与资产附加由 release-drafter.yml 负责
#        （发布前生成 SBOM + 漏洞扫描作为门槛，发布时直接附加到 Assets）
#
#  生成格式：
#    · SPDX 2.3（标准格式，可被各种安全工具扫描）
#    · CycloneDX 1.5（OWASP 标准，供应链安全常用）
#
#  增强功能：
#    · grype 漏洞扫描 — 基于 SBOM 扫描已知漏洞
#    · GitHub Dependency Submission — 将依赖提交到 GitHub Insights
#    · SHA256 校验和 — 验证 SBOM 完整性
# ==============================================================================

name: SBOM

on:
  push:
    branches:
      - main
      - master
    paths:
      - "requirements*.txt"
      - "**/requirements*.txt"
      - "pyproject.toml"
      - "setup.py"
      - "setup.cfg"
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read           # 代码检出

jobs:
  # ── 生成 SBOM + 漏洞扫描 ────────────────────────────────────────────
  generate:
    name: "Generate SBOM + scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      artifact-name: sbom
      critical: ${{ steps.grype-scan.outputs.critical }}
      high: ${{ steps.grype-scan.outputs.high }}
      medium: ${{ steps.grype-scan.outputs.medium }}
      low: ${{ steps.grype-scan.outputs.low }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          syft-version: v1.12.0

      - name: Install Grype
        uses: anchore/scan-action/download-grype@64a33b277ea7a1215a3c142735a1091341939ff5  # v4
        with:
          grype-version: v0.82.0

      - name: Generate SBOM (SPDX format)
        run: |
          syft \
            --file sbom-futures-orderflow.spdx.json \
            --output spdx-json \
            --source-file . \
            --name "futures-orderflow" \
            --version "${{ github.ref_name }}"

      - name: Generate SBOM (CycloneDX format)
        run: |
          syft \
            --file sbom-futures-orderflow.cyclonedx.json \
            --output cyclonedx-json \
            --source-file . \
            --name "futures-orderflow" \
            --version "${{ github.ref_name }}"

      - name: Scan SBOM for vulnerabilities (grype)
        id: grype-scan
        run: |
          echo "=== 漏洞扫描（grype）==="
          echo "基于 SBOM 扫描已知漏洞（CVSS）..."
          echo ""

          # 生成表格格式报告（便于查看）
          grype sbom:sbom-futures-orderflow.spdx.json \
            --output table \
            --fail-on high \
            --only-fixed 2>&1 | tee /tmp/grype-table.txt || true

          # 生成 JSON 格式报告（用于 release asset）
          grype sbom:sbom-futures-orderflow.spdx.json \
            --output json \
            --fail-on never > grype-futures-orderflow.json 2>/dev/null || true

          # 统计各严重级别数量
          CRITICAL=$(jq '.matches[] | select(.vulnerability.severity == "Critical")' grype-futures-orderflow.json 2>/dev/null | grep -c '"id"' || echo "0")
          HIGH=$(jq '.matches[] | select(.vulnerability.severity == "High")' grype-futures-orderflow.json 2>/dev/null | grep -c '"id"' || echo "0")
          MEDIUM=$(jq '.matches[] | select(.vulnerability.severity == "Medium")' grype-futures-orderflow.json 2>/dev/null | grep -c '"id"' || echo "0")
          LOW=$(jq '.matches[] | select(.vulnerability.severity == "Low")' grype-futures-orderflow.json 2>/dev/null | grep -c '"id"' || echo "0")

          echo ""
          echo "=== 漏洞统计 ==="
          echo "| 严重级别 | 数量 |"
          echo "|----------|------|"
          echo "| Critical | $CRITICAL |"
          echo "| High     | $HIGH |"
          echo "| Medium   | $MEDIUM |"
          echo "| Low      | $LOW |"
          echo ""

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT

          # 高危漏洞阻塞（有修复版本的）
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "⚠️  发现高危/严重漏洞，请查看详细报告"
            echo "注意：只有有修复版本的漏洞才会阻塞"
            HAS_FIX=$(jq '[.matches[] | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High") | select(.vulnerability.fix?.version != null)] | length' grype-futures-orderflow.json 2>/dev/null || echo "0")
            echo "有修复版本的高危/严重漏洞数: $HAS_FIX"
            if [ "$HAS_FIX" -gt 0 ]; then
              echo "❌ 存在有修复版本的高危漏洞，阻塞发布"
              exit 1
            fi
          fi

          echo "✅ 漏洞扫描完成（无阻塞级高危漏洞）"

      - name: Generate SBOM checksums
        run: |
          echo "=== 生成校验和 ==="
          sha256sum \
            sbom-futures-orderflow.spdx.json \
            sbom-futures-orderflow.cyclonedx.json \
            grype-futures-orderflow.json \
            > sbom-futures-orderflow.sha256
          cat sbom-futures-orderflow.sha256

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: sbom
          path: |
            sbom-futures-orderflow.spdx.json
            sbom-futures-orderflow.cyclonedx.json
            sbom-futures-orderflow.sha256
            grype-futures-orderflow.json
          if-no-files-found: error
          retention-days: 90

      - name: SBOM + vulnerability summary
        if: always()
        run: |
          echo "### 📦 SBOM 生成 + 漏洞扫描完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 格式 | 文件 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SPDX 2.3 | sbom-futures-orderflow.spdx.json |" >> $GITHUB_STEP_SUMMARY
          echo "| CycloneDX 1.5 | sbom-futures-orderflow.cyclonedx.json |" >> $GITHUB_STEP_SUMMARY
          echo "| Grype 漏洞报告 (JSON) | grype-futures-orderflow.json |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 校验和 | sbom-futures-orderflow.sha256 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**漏洞统计**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 严重级别 | 数量 |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | ${{ steps.grype-scan.outputs.critical }} |" >> $GITHUB_STEP_SUMMARY
          echo "| High     | ${{ steps.grype-scan.outputs.high }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium   | ${{ steps.grype-scan.outputs.medium }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Low      | ${{ steps.grype-scan.outputs.low }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **什么是 SBOM？** 软件物料清单（Software Bill of Materials）" >> $GITHUB_STEP_SUMMARY
          echo "> 列出项目所有依赖及其版本，用于供应链安全审计和漏洞追踪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 用以下命令本地验证 SBOM 完整性：" >> $GITHUB_STEP_SUMMARY
          echo "> \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "> sha256sum -c sbom-futures-orderflow.sha256" >> $GITHUB_STEP_SUMMARY
          echo "> \`\`\`" >> $GITHUB_STEP_SUMMARY

  # ── 提交依赖到 GitHub Dependency Graph ──────────────────────────────
  #  将 SBOM 中的依赖信息提交到 GitHub 的 Dependency graph
  #  这样 GitHub 可以自动检测 Dependabot alerts
  # ========================================================================
  submit-dependencies:
    name: "Submit to GitHub Dependency Graph"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: generate
    # 只在 push 到 main 时提交（PR 不需要，也避免权限问题）
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: write  # 需要写 dependency graph

    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: sbom

      - name: Submit dependencies to GitHub
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5
        with:
          format: SPDX
          sbom-path: sbom-futures-orderflow.spdx.json
          fail-on-severity: high
