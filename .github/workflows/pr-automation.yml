# ==============================================================================
#  CI：PR 自动化
# ==============================================================================
#  功能：
#    · 自动给 PR 打 size 标签（XS/S/M/L/XL，自动移除旧标签）
#    · 根据改动文件自动打 area/* 标签
#    · PR 标题规范检查（Conventional Commits）
#    · 自动将 PR 分配给作者
# ==============================================================================

name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# 并发控制：同一 PR 只保留最新一次运行
concurrency:
  group: pr-automation-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：只授予必要的 GITHUB_TOKEN 权限
permissions:
  contents: read      # 只读代码
  pull-requests: write  # 操作 PR 标签
  issues: write       # 标签管理走 issues API

jobs:
  # ── PR 自动化（合并为一个 job，减少 runner 启动开销） ──────────────────
  #  · 自动给 PR 打 size 标签（XS/S/M/L/XL）
  #  · 自动将 PR 分配给作者（仅 opened 时）
  #  · PR 标题规范检查（Conventional Commits）
  #  以上三个任务都很轻量（< 10s），合并到同一个 runner 中
  # ========================================================================
  pr-automation:
    name: "PR automation"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Size label + Auto-assign + Title check
        id: automation
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const results = {};

            // ── 1. Size label ──────────────────────────────────────
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            let sizeLabel;
            if (total < 30) sizeLabel = "size/XS";
            else if (total < 100) sizeLabel = "size/S";
            else if (total < 500) sizeLabel = "size/M";
            else if (total < 2000) sizeLabel = "size/L";
            else sizeLabel = "size/XL";

            console.log(`📏 Size: +${additions} -${deletions} = ${total} → ${sizeLabel}`);

            // 获取现有标签，移除旧的 size 标签
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: number,
            });

            const oldSizeLabels = labels
              .map(l => l.name)
              .filter(name => name.startsWith('size/') && name !== sizeLabel);

            for (const oldLabel of oldSizeLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: number, name: oldLabel,
                });
              } catch (e) { /* 忽略 */ }
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: number, labels: [sizeLabel],
            });

            results.size = sizeLabel;

            // ── 2. Auto-assign（仅 opened 时） ────────────────────
            if (context.payload.action === 'opened') {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: number, assignees: [author],
              });
              console.log(`👤 Assigned to @${author}`);
              results.assigned = author;
            } else {
              results.assigned = null;
            }

            // ── 3. Title check ────────────────────────────────────
            const title = pr.title.trim();
            const allowedTypes = [
              "feat", "fix", "perf", "refactor", "style",
              "docs", "test", "ci", "build", "chore", "revert",
            ];
            const typePattern = new RegExp(
              `^(${allowedTypes.join("|")})(\\([a-zA-Z0-9._-]+\\))?!?: .+`
            );
            const isValid = typePattern.test(title);
            const maxLength = 72;
            const isTooLong = title.length > maxLength;

            let titleStatus, titleIcon, titleMessage;
            if (isValid && !isTooLong) {
              titleStatus = "pass";
              titleIcon = "✅";
              titleMessage = "标题符合规范";
            } else if (isValid && isTooLong) {
              titleStatus = "warn";
              titleIcon = "⚠️";
              titleMessage = `标题过长（${title.length}/${maxLength} 字符）`;
            } else {
              titleStatus = "fail";
              titleIcon = "❌";
              titleMessage = "标题不符合 Conventional Commits 规范";
            }

            console.log(`${titleIcon} Title: ${titleMessage}`);
            results.titleStatus = titleStatus;
            results.titleMessage = titleMessage;
            results.titleIcon = titleIcon;
            results.title = title;

            // ── Summary ───────────────────────────────────────────
            let summary = `### 🤖 PR 自动化\n\n`;
            summary += `| 任务 | 结果 |\n|---|---|\n`;
            summary += `| **Size 标签** | \`${sizeLabel}\` (+${additions} / -${deletions} = ${total} 行) |\n`;
            if (results.assigned) {
              summary += `| **自动分配** | @${author} |\n`;
            }
            summary += `| **标题检查** | ${titleIcon} ${titleMessage} |\n`;

            if (!isValid) {
              summary += `\n**规范格式**：\`type(scope): 描述\`\n\n`;
              summary += `| 类型 | 说明 |\n|---|---|\n`;
              summary += `| feat | 新功能 |\n| fix | Bug 修复 |\n| perf | 性能优化 |\n`;
              summary += `| refactor | 代码重构 |\n| style | 代码风格 |\n| docs | 文档更新 |\n`;
              summary += `| test | 测试补充 |\n| ci | CI/CD 配置 |\n| chore | 杂项 |\n\n`;
              summary += `**示例**：\`feat(strategy): 新增四维策略止损逻辑\``;
            }

            core.summary.addRaw(summary);
            return results;

  # ── PR 区域标签（根据改动文件自动打 area/* 标签） ───────────────────
  #  配置文件：.github/labeler.yml
  #  标签分类：strategy / risk / signal / execution / data / research / ...
  #  需要 checkout 代码和完整 git 历史，所以单独一个 job
  # ========================================================================
  area-label:
    name: "Area label"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0  # labeler 需要完整历史

      - name: Label PR by changed files
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d  # v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true  # 同步：文件不再改动时移除对应标签
