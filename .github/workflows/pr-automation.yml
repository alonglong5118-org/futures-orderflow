# ==============================================================================
#  CI：PR 自动化
# ==============================================================================
#  功能：
#    · 自动给 PR 打 size 标签（XS/S/M/L/XL，自动移除旧标签）
#    · 根据改动文件自动打 area/* 标签
#    · PR 标题规范检查（Conventional Commits）
# ==============================================================================

name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# 并发控制：同一 PR 只保留最新一次运行
concurrency:
  group: pr-automation-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：只授予必要的 GITHUB_TOKEN 权限
permissions:
  contents: read      # 只读代码
  pull-requests: write  # 操作 PR 标签
  issues: write       # 标签管理走 issues API

jobs:
  # ── PR 大小标签 ─────────────────────────────────────────────────────────
  size-label:
    name: "Size label"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Calculate PR size
        id: size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;
            
            let label;
            if (total < 30) label = "size/XS";
            else if (total < 100) label = "size/S";
            else if (total < 500) label = "size/M";
            else if (total < 2000) label = "size/L";
            else label = "size/XL";
            
            console.log(`Total changes: +${additions} -${deletions} = ${total}`);
            console.log(`Label: ${label}`);

            // 获取现有标签，移除旧的 size 标签
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const oldSizeLabels = labels
              .map(l => l.name)
              .filter(name => name.startsWith('size/') && name !== label);

            // 移除旧标签
            for (const oldLabel of oldSizeLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: oldLabel,
                });
              } catch (e) {
                // 忽略移除失败（可能标签不存在）
              }
            }

            // 添加新标签
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });

            return label;

      - name: PR size summary
        run: |
          echo "### PR 大小：${{ steps.size.outputs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 级别 | 变更行数 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| XS | < 30 行 |" >> $GITHUB_STEP_SUMMARY
          echo "| S | 30 - 100 行 |" >> $GITHUB_STEP_SUMMARY
          echo "| M | 100 - 500 行 |" >> $GITHUB_STEP_SUMMARY
          echo "| L | 500 - 2000 行 |" >> $GITHUB_STEP_SUMMARY
          echo "| XL | > 2000 行 |" >> $GITHUB_STEP_SUMMARY

  # ── PR 区域标签（根据改动文件自动打 area/* 标签） ───────────────────
  #  配置文件：.github/labeler.yml
  #  标签分类：strategy / risk / signal / execution / data / research / ...
  # ========================================================================
  area-label:
    name: "Area label"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # labeler 需要完整历史

      - name: Label PR by changed files
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true  # 同步：文件不再改动时移除对应标签

  # ── PR 标题规范检查 ──────────────────────────────────────────────────────
  #  检查 PR 标题是否符合 Conventional Commits 规范
  #  确保 squash merge 后的 commit message 也规范
  #  不阻塞合并，只做提醒
  # ========================================================================
  title-check:
    name: "Title check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.trim();

            // Conventional Commits 允许的 type
            const allowedTypes = [
              "feat", "fix", "perf", "refactor", "style",
              "docs", "test", "ci", "build", "chore", "revert",
            ];

            const typePattern = new RegExp(
              `^(${allowedTypes.join("|")})(\\([a-zA-Z0-9._-]+\\))?!?: .+`
            );

            const isValid = typePattern.test(title);
            const maxLength = 72;
            const isTooLong = title.length > maxLength;

            let status, icon, message;
            if (isValid && !isTooLong) {
              status = "pass";
              icon = "✅";
              message = "标题符合规范";
            } else if (isValid && isTooLong) {
              status = "warn";
              icon = "⚠️";
              message = `标题过长（${title.length}/${maxLength} 字符）`;
            } else {
              status = "fail";
              icon = "❌";
              message = "标题不符合 Conventional Commits 规范";
            }

            // 写 summary
            let summary = `### 📝 PR 标题检查：${icon} ${message}\n\n`;
            summary += `> **当前标题**：\`${title}\`\n\n`;

            if (!isValid) {
              summary += `**规范格式**：\`type(scope): 描述\`\n\n`;
              summary += `| 类型 | 说明 |\n|---|---|\n`;
              summary += `| feat | 新功能 |\n`;
              summary += `| fix | Bug 修复 |\n`;
              summary += `| perf | 性能优化 |\n`;
              summary += `| refactor | 代码重构 |\n`;
              summary += `| style | 代码风格 |\n`;
              summary += `| docs | 文档更新 |\n`;
              summary += `| test | 测试补充 |\n`;
              summary += `| ci | CI/CD 配置 |\n`;
              summary += `| build | 构建/依赖 |\n`;
              summary += `| chore | 杂项 |\n`;
              summary += `| revert | 回滚 |\n\n`;
              summary += `**示例**：\n`;
              summary += `- ✅ \`feat(strategy): 新增四维策略止损逻辑\`\n`;
              summary += `- ✅ \`fix(risk): 修复风控模块浮盈计算错误\`\n`;
              summary += `- ✅ \`ci(coverage): 添加覆盖率门禁\`\n\n`;
              summary += `> 💡 规范的 PR 标题确保 squash merge 后生成的 commit 信息清晰可读`;
            }

            core.summary.addRaw(summary);
            console.log(`${icon} ${message}: ${title}`);

            // 不阻塞，只做提醒（不抛出错误）
            return status;
