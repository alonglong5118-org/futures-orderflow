# ==============================================================================
#  CI：单元测试 + 冒烟测试
# ==============================================================================
#  触发时机：
#    · PR 到 main/master → Linux + 3.11 单元测试（快速反馈）
#    · push 到 main/master → Linux/macOS + 3.10/3.11/3.12 全矩阵 + 覆盖率
#    · Merge Queue → 合并前最终验证（保证 main 永远绿）
#    · 手动触发
# ==============================================================================

name: Test

run-name: "Test · ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message || 'manual' }}"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"

  # Merge Queue：进入合并队列后跑全量测试（保证 main 永远绿）
  merge_group:
    types: [checks_requested]

  # 支持手动触发
  workflow_dispatch:
    inputs:
      test_scope:
        description: "测试范围"
        required: false
        default: "unit"
        type: choice
        options:
          - smoke
          - unit
          - integration
          - all

# 并发控制：同一分支/PR 只保留最新一次运行，旧的自动取消
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：只授予必要的 GITHUB_TOKEN 权限
permissions:
  contents: read      # 代码检出
  actions: write      # 缓存读写（pytest cache save 需要 write）
  pull-requests: write  # coverage-gate 评论 PR

jobs:
  # ── 路径变更检测 ────────────────────────────────────────────────────
  #  智能判断哪些文件变更了，决定是否需要跑测试/覆盖率
  #  纯文档/配置变更 → 跳过测试，加速 CI
  # ========================================================================
  detect-changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      python_code: ${{ steps.filter.outputs.python_code }}
      tests: ${{ steps.filter.outputs.tests }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      workflows: ${{ steps.filter.outputs.workflows }}
      any_relevant: ${{ steps.filter.outputs.any_relevant }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2  # 需要 base 对比

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python_code:
              - '*.py'
              - '**/*.py'
              - '!tests/**'
              - '!ponytail/**'
            tests:
              - 'tests/**'
              - 'run_tests.py'
              - 'scripts/discover_tests.py'
            dependencies:
              - 'requirements*.txt'
              - 'pyproject.toml'
              - 'setup.py'
              - 'setup.cfg'
            workflows:
              - '.github/workflows/test.yml'
              - '.github/actions/setup-python-deps/**'
            any_relevant:
              - '*.py'
              - '**/*.py'
              - 'tests/**'
              - 'requirements*.txt'
              - 'pyproject.toml'
              - '.github/workflows/test.yml'
              - '.github/actions/setup-python-deps/**'
              - '!ponytail/**'

  # ── 单元测试（多平台 × 多 Python 版本） ─────────────────────────────────
  test:
    name: "${{ matrix.os }} · Py ${{ matrix.python-version }} · ${{ matrix.scope }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: detect-changes
    # 相关文件变更或 workflow 本身变更时才跑
    if: needs.detect-changes.outputs.any_relevant == 'true' || github.event_name == 'push' || github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # PR 只跑 Linux + 3.11（快速反馈），push 到 main 跑全矩阵
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11"]' || '["3.10", "3.11", "3.12"]') }}
        scope: ["unit"]
        exclude:
          # macOS 上只跑 3.11（减少资源消耗，macOS runner 贵）
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore test cache
        uses: actions/cache@v5
        with:
          path: .pytest_cache
          key: pytest-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          restore-keys: |
            pytest-${{ matrix.os }}-py${{ matrix.python-version }}-

      - name: Determine test scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=${{ github.event.inputs.test_scope }}" >> $GITHUB_OUTPUT
          else
            echo "scope=${{ matrix.scope }}" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        id: run-tests
        run: |
          python run_tests.py ${{ steps.scope.outputs.scope }} \
            --junit test-results/${{ matrix.python-version }}-${{ matrix.scope }}.xml \
            --slow 1000

      - name: Test summary
        if: always()
        run: |
          echo "### ✅ 测试完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Python 版本 | ${{ matrix.python-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 测试范围 | ${{ steps.scope.outputs.scope }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 操作系统 | ${{ runner.os }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> JUnit 报告已上传为 artifact，可在「Summary」页面查看详细结果" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.scope }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── 集成测试（仅 main 分支） ───────────────────────────────────────────
  #  PR 阶段不跑（慢），只在 push 到 main 时跑，保障集成层质量
  # ========================================================================
  integration-test:
    name: "Py 3.11 · integration"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-changes
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'merge_group'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Restore pytest cache
        uses: actions/cache@v5
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-py3.11-integration-${{ github.sha }}
          restore-keys: |
            pytest-${{ runner.os }}-py3.11-integration-

      - name: Run integration tests
        run: |
          python run_tests.py integration \
            --junit test-results/3.11-integration.xml \
            --slow 2000

      - name: Integration test summary
        if: always()
        run: |
          echo "### 🧩 集成测试完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Python 版本 | 3.11 |" >> $GITHUB_STEP_SUMMARY
          echo "| 测试范围 | integration |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 仅在 push 到 main 时运行，保障集成层质量" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-py3.11-integration
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── 覆盖率（main 分支） ─────────────────────────────────────────────────
  coverage:
    name: "Coverage report"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, test]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'merge_group'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Run tests with coverage
        run: |
          python run_tests.py unit --coverage

      - name: Generate coverage HTML
        run: |
          coverage html -d coverage-html

      - name: Generate coverage XML (for Codecov)
        run: |
          coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          flags: unit
          name: codecov-unit
          fail_ci_if_error: false  # Codecov 上传失败不阻塞主流程
          token: ${{ secrets.CODECOV_TOKEN }}  # 私有仓库需要，公共仓库可省略

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage-html/
          if-no-files-found: ignore
          retention-days: 30

  # ── 覆盖率门禁（PR 中对比基线） ──────────────────────────────────────────
  coverage-gate:
    name: "Coverage gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, test]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any_relevant == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Run tests with coverage
        run: |
          python run_tests.py unit --coverage

      - name: Generate coverage JSON (for gate check)
        run: |
          python -m coverage json -o coverage.json

      - name: Generate coverage XML (for Codecov)
        run: |
          python -m coverage xml -o coverage.xml

      - name: Upload coverage to Codecov (PR)
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          flags: unit,pr
          name: codecov-pr
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage gate
        run: |
          echo "=== 覆盖率门禁检查 ==="
          python scripts/check_coverage.py --baseline tests/_coverage_baseline.json --tolerance 0.5

      - name: Generate coverage report for PR comment
        if: always()
        id: report
        run: |
          python scripts/check_coverage.py \
            --baseline tests/_coverage_baseline.json \
            --tolerance 0.5 \
            --format markdown \
            > /tmp/coverage_report.md || true
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/coverage_report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment coverage report on PR
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = `${{ steps.report.outputs.report }}`;

            // 查找已有的覆盖率评论
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('📊 覆盖率报告')
            );

            const body = `### 📊 覆盖率报告\n\n${report}`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── 测试结果汇总（PR 评论用） ───────────────────────────────────────────
  summary:
    name: "Test summary"
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-changes, test]

    steps:
      - name: Check test status
        id: check
        run: |
          # 如果检测到无相关变更，标记为跳过
          if [ "${{ needs.detect-changes.outputs.any_relevant }}" = "false" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "status=skipped" >> $GITHUB_OUTPUT
            echo "icon=⏭" >> $GITHUB_OUTPUT
            echo "message=无相关代码变更，跳过测试" >> $GITHUB_OUTPUT
          elif [ "${{ needs.test.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "icon=✅" >> $GITHUB_OUTPUT
            echo "message=全部测试通过" >> $GITHUB_OUTPUT
          elif [ "${{ needs.test.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "icon=❌" >> $GITHUB_OUTPUT
            echo "message=有测试失败" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
            echo "icon=⏭" >> $GITHUB_OUTPUT
            echo "message=测试被跳过" >> $GITHUB_OUTPUT
          fi

      - name: Add job summary
        run: |
          echo "# ${{ steps.check.outputs.icon }} 测试结果：${{ steps.check.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **触发方式**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "查看详情：Actions → 对应 job → Artifacts" >> $GITHUB_STEP_SUMMARY
