# ==============================================================================
#  CI：单元测试 + 冒烟测试
# ==============================================================================
#  触发时机：
#    · PR 到 main/master → 跑全量单元测试
#    · push 到 main/master → 跑全量单元测试 + 覆盖率
#    · push 到其他分支 → 跑冒烟测试（快速反馈）
# ==============================================================================

name: Test

run-name: "Test · ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message || 'manual' }}"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"

  # 支持手动触发
  workflow_dispatch:
    inputs:
      test_scope:
        description: "测试范围"
        required: false
        default: "unit"
        type: choice
        options:
          - smoke
          - unit
          - integration
          - all

# 并发控制：同一分支/PR 只保留最新一次运行，旧的自动取消
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：只授予必要的 GITHUB_TOKEN 权限
permissions:
  contents: read      # 代码检出
  actions: write      # 缓存读写（pytest cache save 需要 write）
  pull-requests: write  # coverage-gate 评论 PR

jobs:
  # ── 单元测试（多版本 Python） ────────────────────────────────────────────
  test:
    name: "Py ${{ matrix.python-version }} · ${{ matrix.scope }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # PR 只跑 3.11（快速反馈），push 到 main 跑全矩阵（兼容性保障）
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11"]' || '["3.10", "3.11", "3.12"]') }}
        scope: ["unit"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          restore-keys: |
            pytest-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Determine test scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=${{ github.event.inputs.test_scope }}" >> $GITHUB_OUTPUT
          else
            echo "scope=${{ matrix.scope }}" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        id: run-tests
        run: |
          python run_tests.py ${{ steps.scope.outputs.scope }} \
            --junit test-results/${{ matrix.python-version }}-${{ matrix.scope }}.xml \
            --slow 1000

      - name: Test summary
        if: always()
        run: |
          echo "### ✅ 测试完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Python 版本 | ${{ matrix.python-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 测试范围 | ${{ steps.scope.outputs.scope }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 操作系统 | ${{ runner.os }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> JUnit 报告已上传为 artifact，可在「Summary」页面查看详细结果" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}-${{ matrix.scope }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── 集成测试（仅 main 分支） ───────────────────────────────────────────
  #  PR 阶段不跑（慢），只在 push 到 main 时跑，保障集成层质量
  # ========================================================================
  integration-test:
    name: "Py 3.11 · integration"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Restore pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-py3.11-integration-${{ github.sha }}
          restore-keys: |
            pytest-${{ runner.os }}-py3.11-integration-

      - name: Run integration tests
        run: |
          python run_tests.py integration \
            --junit test-results/3.11-integration.xml \
            --slow 2000

      - name: Integration test summary
        if: always()
        run: |
          echo "### 🧩 集成测试完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Python 版本 | 3.11 |" >> $GITHUB_STEP_SUMMARY
          echo "| 测试范围 | integration |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 仅在 push 到 main 时运行，保障集成层质量" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py3.11-integration
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── 覆盖率（main 分支） ─────────────────────────────────────────────────
  coverage:
    name: "Coverage report"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Run tests with coverage
        run: |
          python run_tests.py unit --coverage

      - name: Generate coverage HTML
        run: |
          coverage html -d coverage-html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          if-no-files-found: ignore
          retention-days: 30

  # ── 覆盖率门禁（PR 中对比基线） ──────────────────────────────────────────
  coverage-gate:
    name: "Coverage gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Run tests with coverage
        run: |
          python run_tests.py unit --coverage

      - name: Check coverage gate
        run: |
          echo "=== 覆盖率门禁检查 ==="
          python scripts/check_coverage.py --baseline tests/_coverage_baseline.json --tolerance 0.5

      - name: Generate coverage report for PR comment
        if: always()
        id: report
        run: |
          python scripts/check_coverage.py \
            --baseline tests/_coverage_baseline.json \
            --tolerance 0.5 \
            --format markdown \
            > /tmp/coverage_report.md || true
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/coverage_report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment coverage report on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = `${{ steps.report.outputs.report }}`;

            // 查找已有的覆盖率评论
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('📊 覆盖率报告')
            );

            const body = `### 📊 覆盖率报告\n\n${report}`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── 测试结果汇总（PR 评论用） ───────────────────────────────────────────
  summary:
    name: "Test summary"
    runs-on: ubuntu-latest
    if: always()
    needs: test

    steps:
      - name: Check test status
        id: check
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "icon=✅" >> $GITHUB_OUTPUT
            echo "message=全部测试通过" >> $GITHUB_OUTPUT
          elif [ "${{ needs.test.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "icon=❌" >> $GITHUB_OUTPUT
            echo "message=有测试失败" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
            echo "icon=⏭" >> $GITHUB_OUTPUT
            echo "message=测试被跳过" >> $GITHUB_OUTPUT
          fi

      - name: Add job summary
        run: |
          echo "# ${{ steps.check.outputs.icon }} 测试结果：${{ steps.check.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **触发方式**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "查看详情：Actions → 对应 job → Artifacts" >> $GITHUB_STEP_SUMMARY
