# ==============================================================================
#  CI：代码质量检查
# ==============================================================================
#  触发时机：PR 到 main/master、手动触发
#  检查内容：
#    · 语法检查（py_compile）
#    · 测试文件命名规范
#    · 基准文件完整性
#    · 预提交钩子一致性
#    · Ruff 关键 lint（阻塞级 — 抓真 bug）
#    · Ruff 风格 lint（建议级 — 只报告）
#    · Ruff 格式化检查（建议级）
#    · mypy 类型检查（建议级）
# ==============================================================================

name: Code Quality

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  # ── 语法检查 ────────────────────────────────────────────────────────────
  syntax:
    name: "Syntax check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python files
        run: |
          echo "=== Python 语法检查 ==="
          find . -name "*.py" -not -path "./.git/*" -not -path "./node_modules/*" \
            -not -path "./ponytail/*" | xargs python -m py_compile 2>&1
          echo "✅ 语法检查通过"

  # ── 测试规范检查 ────────────────────────────────────────────────────────
  test-standards:
    name: "Test standards"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check test file naming
        run: |
          echo "=== 测试文件命名规范 ==="
          mismatched=$(find tests/ -name "*.py" -not -name "test_*" -not -name "_*" 2>/dev/null || true)
          if [ -n "$mismatched" ]; then
            echo "❌ 以下测试文件命名不规范（应以 test_ 开头）："
            echo "$mismatched"
            exit 1
          fi
          echo "✅ 命名规范通过"

      - name: Verify baseline file integrity
        run: |
          echo "=== 基准文件完整性 ==="
          if [ ! -f "tests/_baseline_values.json" ]; then
            echo "⚠️  基准文件不存在（首次添加时正常）"
            exit 0
          fi
          python -c "
          import json
          with open('tests/_baseline_values.json') as f:
              data = json.load(f)
          print(f'✅ 基准文件有效，包含 {len(data)} 个基准项')
          for k in list(data.keys())[:5]:
              print(f'   · {k}')
          if len(data) > 5:
              print(f'   ... 还有 {len(data)-5} 项')
          "

  # ── 测试可发现性检查 ────────────────────────────────────────────────────
  discover-check:
    name: "Test discovery sync"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run discover and compare
        run: |
          echo "=== 测试发现一致性检查 ==="
          python scripts/discover_tests.py > /tmp/discovered.txt
          echo ""
          echo "检查 run_tests.py 中的 TEST_MODULES 是否与实际文件一致..."

          count=$(grep -c "→ tests.test_" /tmp/discovered.txt || true)
          if [ "$count" -lt 10 ]; then
            echo "❌ 发现的测试模块太少（$count 个），可能有问题"
            exit 1
          fi
          echo "✅ 发现 $count 个测试模块，自动发现正常"
          echo ""
          echo "💡 提示：如果新增了测试文件但忘记注册，运行："
          echo "   python scripts/discover_tests.py --update"

  # ── Ruff 关键 lint（阻塞级） ────────────────────────────────────────────
  #  抓确定性 bug + 代码质量硬约束（会导致问题或明确是坏味道的）：
  #    F401  — 未使用的导入（代码异味，增加误导性）
  #    F601  — 字典重复 key（后面的值覆盖前面的，几乎一定是 bug）
  #    F701  — break/continue 在循环外（语法错误）
  #    F821  — 未定义的名字（NameError）
  #    F823  — 赋值前引用局部变量（UnboundLocalError）
  #    I001  — 导入排序不规范（可读性 + 减少合并冲突）
  #    B023  — 闭包/函数引用循环变量（晚绑定导致所有调用都用最后一个值）
  #    B904  — except 内 raise 不带 from（丢失异常链，调试困难）
  #    E722  — 裸 except（会吞掉 KeyboardInterrupt/SystemExit 等）
  #    E712  — 与 True/False 做等值比较（应使用 is / not）
  # ========================================================================
  ruff-critical:
    name: "Ruff · Critical lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run critical lint
        run: |
          echo "=== Ruff 关键检查（阻塞级）==="
          echo "检查会导致运行时报错或代码质量硬约束..."
          ruff check . \
            --select F401,F601,F701,F821,F823,I001,B023,B904,E722,E712 \
            --output-format=github
          echo "✅ 关键检查通过"

  # ── Ruff 风格 lint（建议级 · 不阻塞） ──────────────────────────────────
  ruff-style:
    name: "Ruff · Style lint (advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run style lint
        run: |
          echo "=== Ruff 风格检查（建议级，不阻塞合并）==="
          echo "包含：代码风格、导入排序、未使用导入、pathlib 建议等"
          echo ""
          ruff check . --statistics --exit-zero
          echo ""
          echo "📊 以上为建议改进项，不阻塞 PR 合并"

  # ── Ruff 格式化检查（建议级 · 不阻塞） ─────────────────────────────────
  ruff-format:
    name: "Ruff · Format check (advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting
        run: |
          echo "=== Ruff 格式化检查（建议级）==="
          echo "检查代码格式是否符合规范..."
          echo ""
          if ruff format --check --diff . 2>&1; then
            echo "✅ 格式检查通过"
          else
            echo "⚠️  部分文件格式不规范（上方 diff 显示差异）"
            echo "💡 可运行 'ruff format .' 自动修复"
            exit 0  # 建议级，不阻塞
          fi

  # ── mypy 类型检查（建议级 · 不阻塞） ───────────────────────────────────
  mypy:
    name: "mypy · Type check (advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: |
          echo "=== mypy 类型检查（建议级，不阻塞合并）==="
          echo "对核心源码进行静态类型检查..."
          echo ""
          mypy . --ignore-missing-imports 2>&1 || true
          echo ""
          echo "📊 以上为类型检查建议，不阻塞 PR 合并"
