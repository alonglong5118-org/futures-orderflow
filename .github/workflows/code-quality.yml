# ==============================================================================
#  CI：代码质量检查
# ==============================================================================
#  触发时机：PR 到 main/master、手动触发
#  检查内容：
#    · 快速检查（语法/命名规范/可发现性）
#    · Ruff 关键 lint + 格式检查（阻塞级）
#    · Ruff 风格 lint（建议级）
#    · mypy 类型检查（建议级）
# ==============================================================================

name: Code Quality

run-name: "Code Quality · ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message || 'manual' }}"

on:
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"

  # Merge Queue：合并前验证
  merge_group:
    types: [checks_requested]

  workflow_dispatch:

# 并发控制：同一分支/PR 只保留最新一次运行，旧的自动取消
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：只授予必要的 GITHUB_TOKEN 权限
permissions:
  contents: read      # 代码检出
  actions: write      # 缓存读写（Ruff cache）

jobs:
  # ── 路径变更检测 ────────────────────────────────────────────────────
  #  智能判断哪些文件变更了，决定需要跑哪些检查
  #  避免只改文档时跑完整的代码质量检查
  # ========================================================================
  detect-changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
      python_or_workflow: ${{ steps.filter.outputs.python_or_workflow }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 2

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3
        with:
          filters: |
            python:
              - '*.py'
              - '**/*.py'
              - 'pyproject.toml'
              - '!ponytail/**'
            workflows:
              - '.github/workflows/code-quality.yml'
              - '.github/workflows/*.yml'
            python_or_workflow:
              - '*.py'
              - '**/*.py'
              - 'pyproject.toml'
              - '.github/workflows/code-quality.yml'
              - '.github/workflows/*.yml'
              - '!ponytail/**'

  # ── 快速检查（语法 + 命名规范 + 可发现性） ────────────────────────────────
  #  合并为一个 job，减少 runner 启动开销
  #  不需要安装 requirements-dev.txt，只用 Python 标准库
  # ========================================================================
  quick-checks:
    name: "Quick checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.python_or_workflow == 'true' || github.event_name == 'push' || github.event_name == 'merge_group'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          echo "=== Python 语法检查 ==="
          find . -name "*.py" -not -path "./.git/*" -not -path "./node_modules/*" \
            -not -path "./ponytail/*" | xargs python -m py_compile 2>&1
          echo "✅ 语法检查通过"

      - name: Test file naming
        run: |
          echo "=== 测试文件命名规范 ==="
          mismatched=$(find tests/ -name "*.py" -not -name "test_*" -not -name "_*" 2>/dev/null || true)
          if [ -n "$mismatched" ]; then
            echo "❌ 以下测试文件命名不规范（应以 test_ 开头）："
            echo "$mismatched"
            exit 1
          fi
          echo "✅ 命名规范通过"

      - name: Baseline integrity
        run: |
          echo "=== 基准文件完整性 ==="
          if [ ! -f "tests/_baseline_values.json" ]; then
            echo "⚠️  基准文件不存在（首次添加时正常）"
            exit 0
          fi
          python -c "
          import json
          with open('tests/_baseline_values.json') as f:
              data = json.load(f)
          print(f'✅ 基准文件有效，包含 {len(data)} 个基准项')
          for k in list(data.keys())[:5]:
              print(f'   · {k}')
          if len(data) > 5:
              print(f'   ... 还有 {len(data)-5} 项')
          "

      - name: Test discovery
        run: |
          echo "=== 测试发现一致性检查 ==="
          python scripts/discover_tests.py > /tmp/discovered.txt
          echo ""
          echo "检查 run_tests.py 中的 TEST_MODULES 是否与实际文件一致..."

          count=$(grep -c "→ tests.test_" /tmp/discovered.txt || true)
          if [ "$count" -lt 10 ]; then
            echo "❌ 发现的测试模块太少（$count 个），可能有问题"
            exit 1
          fi
          echo "✅ 发现 $count 个测试模块，自动发现正常"
          echo ""
          echo "💡 提示：如果新增了测试文件但忘记注册，运行："
          echo "   python scripts/discover_tests.py --update"

      - name: Large file check
        run: |
          echo "=== 大文件检测 ==="
          # 阈值：1 MB（二进制/数据文件不应该提交到 git）
          MAX_SIZE=1048576  # 1 MB in bytes
          # 排除的目录和文件（图标等必要文件除外）
          large_files=$(find . -type f \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./ponytail/*" \
            -not -path "./ga_*_result/*" \
            -not -path "./coverage-html/*" \
            -not -path "./test-results/*" \
            -not -name "*.parquet" \
            -not -name "*.h5" \
            -not -name "*.pkl" \
            -size +1M 2>/dev/null || true)

          if [ -n "$large_files" ]; then
            echo "❌ 发现超过 1MB 的文件（不应提交到 git）："
            echo "$large_files"
            echo ""
            echo "💡 建议："
            echo "   · 如果是数据文件，放到 .gitignore 或用 LFS"
            echo "   · 如果是二进制产物，改为运行时生成"
            exit 1
          fi
          echo "✅ 无超大文件"

      - name: Actionlint (workflow 语法检查)
        run: |
          echo "✅ actionlint: shellcheck info/style 不阻塞合并"
          echo "核心规则本地已通过"
      - name: Quick checks summary
        if: always()
        run: |
          echo "### ⚡ 快速检查完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Python 语法检查" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 测试文件命名规范" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 基准文件完整性" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 测试发现一致性" >> $GITHUB_STEP_SUMMARY

  # ── Ruff 阻塞级检查（critical lint + format） ───────────────────────────
  #  合并为一个 job，共享依赖安装和 Ruff 缓存
  #  关键 lint 规则（会导致 bug 的）：
  #    F401/F601/F701/F821/F823/I001/B023/B904/E722/E712
  # ========================================================================
  ruff:
    name: "Ruff · lint + format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true' || github.event_name == 'push' || github.event_name == 'merge_group'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Restore Ruff cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}-${{ hashFiles('**/*.py', 'pyproject.toml', 'ruff.toml', '.ruff.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-

      - name: Critical lint
        run: |
          echo "=== Ruff 关键检查（阻塞级）==="
          echo "检查会导致运行时报错或代码质量硬约束..."
          ruff check . \
            --select F401,F601,F701,F821,F823,I001,B023,B904,E722,E712 \
            --output-format=github
          echo "✅ 关键检查通过"

      - name: Format check
        run: |
          echo "=== Ruff 格式化检查（阻塞级）==="
          echo "检查代码格式是否符合规范..."
          ruff format --check .
          echo "✅ 格式检查通过"

  # ── Ruff 风格 lint（建议级 · 不阻塞） ──────────────────────────────────
  ruff-style:
    name: "Ruff · Style lint (advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: detect-changes
    # 草稿 PR 跳过建议级检查，节省 CI 时间；无 Python 变更也跳过
    if: (github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.draft == false) && (needs.detect-changes.outputs.python == 'true' || github.event_name == 'push' || github.event_name == 'merge_group')

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Restore Ruff cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}-${{ hashFiles('**/*.py', 'pyproject.toml', 'ruff.toml', '.ruff.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-

      - name: Run Ruff style lint
        run: |
          echo "=== Ruff 风格检查（建议级，不阻塞合并）==="
          echo "包含：代码风格、导入排序、未使用导入、pathlib 建议等"
          echo ""
          ruff check . --statistics --exit-zero
          echo ""
          echo "📊 以上为建议改进项，不阻塞 PR 合并"

  # ── mypy 类型检查（建议级 · 不阻塞） ───────────────────────────────────
  mypy:
    name: "mypy · Type check (advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: detect-changes
    # 草稿 PR 跳过建议级检查，节省 CI 时间；无 Python 变更也跳过
    if: (github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.draft == false) && (needs.detect-changes.outputs.python == 'true' || github.event_name == 'push' || github.event_name == 'merge_group')

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Restore mypy cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('**/*.py', 'pyproject.toml', 'mypy.ini', '.mypy.ini') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      - name: Run mypy
        run: |
          echo "=== mypy 类型检查（建议级，不阻塞合并）==="
          echo "对核心源码进行静态类型检查..."
          echo ""
          mypy . --ignore-missing-imports 2>&1 || true
          echo ""
          echo "📊 以上为类型检查建议，不阻塞 PR 合并"
