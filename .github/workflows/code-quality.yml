# ==============================================================================
#  CI：代码质量检查
# ==============================================================================
#  触发时机：PR 到 main/master、手动触发
#  检查内容：
#    · 快速检查（语法/命名规范/可发现性）
#    · Ruff 关键 lint + 格式检查（阻塞级）
#    · Ruff 风格 lint（建议级）
#    · mypy 类型检查（建议级）
# ==============================================================================

name: Code Quality

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

  workflow_dispatch:

# 并发控制：同一分支/PR 只保留最新一次运行，旧的自动取消
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 快速检查（语法 + 命名规范 + 可发现性） ────────────────────────────────
  #  合并为一个 job，减少 runner 启动开销
  #  不需要安装 requirements-dev.txt，只用 Python 标准库
  # ========================================================================
  quick-checks:
    name: "Quick checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          echo "=== Python 语法检查 ==="
          find . -name "*.py" -not -path "./.git/*" -not -path "./node_modules/*" \
            -not -path "./ponytail/*" | xargs python -m py_compile 2>&1
          echo "✅ 语法检查通过"

      - name: Test file naming
        run: |
          echo "=== 测试文件命名规范 ==="
          mismatched=$(find tests/ -name "*.py" -not -name "test_*" -not -name "_*" 2>/dev/null || true)
          if [ -n "$mismatched" ]; then
            echo "❌ 以下测试文件命名不规范（应以 test_ 开头）："
            echo "$mismatched"
            exit 1
          fi
          echo "✅ 命名规范通过"

      - name: Baseline integrity
        run: |
          echo "=== 基准文件完整性 ==="
          if [ ! -f "tests/_baseline_values.json" ]; then
            echo "⚠️  基准文件不存在（首次添加时正常）"
            exit 0
          fi
          python -c "
          import json
          with open('tests/_baseline_values.json') as f:
              data = json.load(f)
          print(f'✅ 基准文件有效，包含 {len(data)} 个基准项')
          for k in list(data.keys())[:5]:
              print(f'   · {k}')
          if len(data) > 5:
              print(f'   ... 还有 {len(data)-5} 项')
          "

      - name: Test discovery
        run: |
          echo "=== 测试发现一致性检查 ==="
          python scripts/discover_tests.py > /tmp/discovered.txt
          echo ""
          echo "检查 run_tests.py 中的 TEST_MODULES 是否与实际文件一致..."

          count=$(grep -c "→ tests.test_" /tmp/discovered.txt || true)
          if [ "$count" -lt 10 ]; then
            echo "❌ 发现的测试模块太少（$count 个），可能有问题"
            exit 1
          fi
          echo "✅ 发现 $count 个测试模块，自动发现正常"
          echo ""
          echo "💡 提示：如果新增了测试文件但忘记注册，运行："
          echo "   python scripts/discover_tests.py --update"

  # ── Ruff 阻塞级检查（critical lint + format） ───────────────────────────
  #  合并为一个 job，共享依赖安装和 Ruff 缓存
  #  关键 lint 规则（会导致 bug 的）：
  #    F401/F601/F701/F821/F823/I001/B023/B904/E722/E712
  # ========================================================================
  ruff:
    name: "Ruff · lint + format"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Restore Ruff cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}-${{ hashFiles('**/*.py', 'pyproject.toml', 'ruff.toml', '.ruff.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-

      - name: Critical lint
        run: |
          echo "=== Ruff 关键检查（阻塞级）==="
          echo "检查会导致运行时报错或代码质量硬约束..."
          ruff check . \
            --select F401,F601,F701,F821,F823,I001,B023,B904,E722,E712 \
            --output-format=github
          echo "✅ 关键检查通过"

      - name: Format check
        run: |
          echo "=== Ruff 格式化检查（阻塞级）==="
          echo "检查代码格式是否符合规范..."
          ruff format --check .
          echo "✅ 格式检查通过"

  # ── Ruff 风格 lint（建议级 · 不阻塞） ──────────────────────────────────
  ruff-style:
    name: "Ruff · Style lint (advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true
    # 草稿 PR 跳过建议级检查，节省 CI 时间
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Restore Ruff cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}-${{ hashFiles('**/*.py', 'pyproject.toml', 'ruff.toml', '.ruff.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-

      - name: Run style lint
        run: |
          echo "=== Ruff 风格检查（建议级，不阻塞合并）==="
          echo "包含：代码风格、导入排序、未使用导入、pathlib 建议等"
          echo ""
          ruff check . --statistics --exit-zero
          echo ""
          echo "📊 以上为建议改进项，不阻塞 PR 合并"

  # ── mypy 类型检查（建议级 · 不阻塞） ───────────────────────────────────
  mypy:
    name: "mypy · Type check (advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true
    # 草稿 PR 跳过建议级检查，节省 CI 时间
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Run mypy
        run: |
          echo "=== mypy 类型检查（建议级，不阻塞合并）==="
          echo "对核心源码进行静态类型检查..."
          echo ""
          mypy . --ignore-missing-imports 2>&1 || true
          echo ""
          echo "📊 以上为类型检查建议，不阻塞 PR 合并"
