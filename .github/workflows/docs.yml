# ==============================================================================
#  CI：MkDocs 文档构建与部署
# ==============================================================================
#  触发时机：
#    · push 到 main 分支，且 docs/ 目录或 mkdocs.yml 有变更
#    · 手动触发（workflow_dispatch）
#
#  功能：
#    · 安装 Python 及 MkDocs Material 全套依赖
#    · 执行 mkdocs build 验证构建
#    · 上传 site 目录为 artifact（便于预览）
#    · 部署到 GitHub Pages（使用官方 deploy-pages）
# ==============================================================================

name: Docs

run-name: "Docs · ${{ github.event.head_commit.message || 'manual' }}"

# ── 触发条件 ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-dev.txt"
      - ".github/workflows/docs.yml"

  # 手动触发
  workflow_dispatch:
    inputs:
      deploy:
        description: "是否部署到 GitHub Pages"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# ── 权限 ──────────────────────────────────────────────────────────────────────
permissions:
  contents: read
  pages: write
  id-token: write

# ── 并发控制 ──────────────────────────────────────────────────────────────────
concurrency:
  group: "pages"
  cancel-in-progress: false

# ── Job 定义 ──────────────────────────────────────────────────────────────────
jobs:
  # ---------------------------------------------------------------------------
  #  构建文档
  # ---------------------------------------------------------------------------
  build:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.deploy-check.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0        # git-revision-date / git-committers 插件需要完整历史
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build documentation
        run: |
          mkdocs build

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mkdocs-site
          path: site
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

      - name: Determine if deploy is needed
        id: deploy-check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.deploy }}" == "false" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  #  部署到 GitHub Pages
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
