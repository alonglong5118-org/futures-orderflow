# ==============================================================================
#  CI：安全扫描
# ==============================================================================
#  触发时机：
#    · PR 到 main/master → 跑全部安全扫描
#    · push 到 main/master → 跑全部安全扫描
#    · 手动触发
#  扫描内容：
#    · gitleaks            — 密钥泄露检测（阻塞级 · 防止提交密钥）
#    · dependency-review   — 依赖变更审查（PR 专用 · 防止引入漏洞依赖）
#    · bandit              — Python 代码安全扫描（High 阻塞 · Medium 建议）
#    · pip-audit           — 依赖漏洞扫描（High 阻塞 · 中低危建议）
# ==============================================================================

name: Security Scan

run-name: "Security · ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message || 'manual' }}"

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

  # Merge Queue：合并前安全验证
  merge_group:
    types: [checks_requested]

  workflow_dispatch:

# 并发控制：同一分支/PR 只保留最新一次运行，旧的自动取消
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：只授予必要的 GITHUB_TOKEN 权限
permissions:
  contents: read      # 代码检出（gitleaks 需要 full history 但仍是 read）
  actions: read       # 只读缓存（python-security 不写缓存）
  security-events: write  # gitleaks 上报安全事件

jobs:
  # ── 密钥泄露检测 ────────────────────────────────────────────────────
  #  最高优先级：防止 API Key、Token、密码等敏感信息被提交到代码库
  #  对于实盘交易系统，这是安全红线
  # ========================================================================
  gitleaks:
    name: "Secret scan (gitleaks)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要全量历史才能扫描

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── 依赖变更审查（仅 PR） ────────────────────────────────────────────
  #  在 PR 中检查依赖变更，防止引入有已知漏洞的包
  #  对比 base 和 head 的 requirements*.txt 差异
  #  High 级别的漏洞会阻塞合并
  # ========================================================================
  dependency-review:
    name: "Dependency review"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          # 高危漏洞阻塞，中低危只警告
          fail-on-severity: high
          # 只检查生产依赖（requirements.txt），不检查 dev 依赖
          # 留空则检查所有 manifest 文件
          # 也可以用 deny/allow lists 精细控制
          comment-summary-in-pr: on-failure  # 只有失败时才发 PR 评论
          license-check: false  # 暂时不做许可证检查

  # ── Python 安全扫描（bandit + pip-audit） ─────────────────────────────
  #  合并为一个 job，共享 Python 环境
  #  · bandit High 级别 — 阻塞
  #  · bandit Medium 级别 — 建议（不阻塞）
  #  · pip-audit 依赖漏洞 — 建议（不阻塞）
  # ========================================================================
  python-security:
    name: "Python security scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Restore pip-audit OSV cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip-audit
          key: pip-audit-osv-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            pip-audit-osv-${{ runner.os }}-

      - name: Bandit · High severity (blocking)
        run: |
          echo "=== Bandit 安全扫描（High 级别 · 阻塞级）==="
          echo "扫描高危安全问题..."
          echo ""
          bandit -r . -c .bandit -lll
          echo ""
          echo "✅ 高危安全扫描通过"

      - name: Bandit · Medium severity (advisory)
        if: always()
        run: |
          echo "=== Bandit 安全扫描（Medium 级别 · 建议级）==="
          echo "以下为中危安全问题，供参考，不阻塞合并..."
          echo ""
          bandit -r . -ll || true
          echo ""
          echo "📊 以上为中危安全问题建议，不阻塞 PR 合并"

      - name: pip-audit · High severity (blocking)
        run: |
          echo "=== 依赖漏洞扫描（High 级别 · 阻塞级）==="
          echo "检查高危依赖漏洞（CVSS >= 7.0）..."
          echo ""
          pip-audit --desc on --format columns --vulnerability-service osv --severity high
          echo ""
          echo "✅ 高危依赖漏洞扫描通过"

      - name: pip-audit · Medium/Low severity (advisory)
        if: always()
        run: |
          echo "=== 依赖漏洞扫描（中低危 · 建议级，不阻塞合并）==="
          echo "以下为中低危依赖漏洞，供参考，不阻塞合并..."
          echo ""
          # 先跑一遍全量获取总数，然后只展示非高危的
          set +e
          pip-audit --desc on --format columns --vulnerability-service osv 2>&1
          set -e
          echo ""
          echo "📊 以上为完整依赖漏洞扫描结果（高危已单独阻塞检查），不阻塞 PR 合并"
