# ==============================================================================
#  CI：安全扫描
# ==============================================================================
#  触发时机：
#    · PR 到 main/master → 跑全部安全扫描
#    · push 到 main/master → 跑全部安全扫描
#    · 手动触发
#  扫描内容：
#    · gitleaks   — 密钥泄露检测（阻塞级 · 防止提交密钥）
#    · bandit     — Python 代码安全扫描（High 阻塞 · Medium 建议）
#    · pip-audit  — 依赖漏洞扫描（建议级）
# ==============================================================================

name: Security Scan

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

  workflow_dispatch:

# 并发控制：同一分支/PR 只保留最新一次运行，旧的自动取消
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 密钥泄露检测 ────────────────────────────────────────────────────
  #  最高优先级：防止 API Key、Token、密码等敏感信息被提交到代码库
  #  对于实盘交易系统，这是安全红线
  # ========================================================================
  gitleaks:
    name: "Secret scan (gitleaks)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要全量历史才能扫描

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── Python 安全扫描（bandit + pip-audit） ─────────────────────────────
  #  合并为一个 job，共享 Python 环境
  #  · bandit High 级别 — 阻塞
  #  · bandit Medium 级别 — 建议（不阻塞）
  #  · pip-audit 依赖漏洞 — 建议（不阻塞）
  # ========================================================================
  python-security:
    name: "Python security scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Bandit · High severity (blocking)
        run: |
          echo "=== Bandit 安全扫描（High 级别 · 阻塞级）==="
          echo "扫描高危安全问题..."
          echo ""
          bandit -r . -c .bandit -lll
          echo ""
          echo "✅ 高危安全扫描通过"

      - name: Bandit · Medium severity (advisory)
        if: always()
        run: |
          echo "=== Bandit 安全扫描（Medium 级别 · 建议级）==="
          echo "以下为中危安全问题，供参考，不阻塞合并..."
          echo ""
          bandit -r . -ll || true
          echo ""
          echo "📊 以上为中危安全问题建议，不阻塞 PR 合并"

      - name: pip-audit · Dependency audit (advisory)
        if: always()
        run: |
          echo "=== 依赖漏洞扫描（建议级，不阻塞合并）==="
          echo "检查依赖包是否有已知 CVE 漏洞..."
          echo ""
          pip-audit --desc on --format columns || true
          echo ""
          echo "📊 以上为依赖漏洞扫描结果，不阻塞 PR 合并"
