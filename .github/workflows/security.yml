# ==============================================================================
#  CI：安全扫描
# ==============================================================================
#  触发时机：
#    · PR 到 main/master → 跑全部安全扫描
#    · push 到 main/master → 跑全部安全扫描
#    · 手动触发
#  扫描内容：
#    · gitleaks   — 密钥泄露检测（阻塞级 · 防止提交密钥）
#    · bandit     — Python 代码安全扫描（High 阻塞 · Medium 建议）
#    · pip-audit  — 依赖漏洞扫描（建议级 · 先看现状）
# ==============================================================================

name: Security Scan

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  # ── 密钥泄露检测 ────────────────────────────────────────────────────
  #  最高优先级：防止 API Key、Token、密码等敏感信息被提交到代码库
  #  对于实盘交易系统，这是安全红线
  # ========================================================================
  gitleaks:
    name: "Secret scan (gitleaks)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要全量历史才能扫描

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── Python 代码安全扫描（阻塞级 · High） ─────────────────────────────
  #  只阻断 High 严重级别的安全问题
  #  Medium 级别在下面的 advisory job 中报告
  # ========================================================================
  bandit:
    name: "Security lint (bandit)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run bandit (High severity · blocking)
        run: |
          echo "=== Bandit 安全扫描（High 级别 · 阻塞级）==="
          echo "扫描高危安全问题..."
          echo ""
          bandit -r . -c .bandit -lll
          echo ""
          echo "✅ 高危安全扫描通过"

  # ── Python 代码安全扫描（建议级 · Medium） ──────────────────────────
  #  报告 Medium 级别安全问题，不阻塞合并
  #  主要是 urllib.urlopen 等需要人工确认的项
  # ========================================================================
  bandit-advisory:
    name: "Security advisory (bandit · medium)"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run bandit (Medium severity · advisory)
        run: |
          echo "=== Bandit 安全扫描（Medium 级别 · 建议级）==="
          echo "以下为中危安全问题，供参考，不阻塞合并..."
          echo ""
          bandit -r . -ll || true
          echo ""
          echo "📊 以上为中危安全问题建议，不阻塞 PR 合并"

  # ── 依赖漏洞扫描（建议级 · 不阻塞） ──────────────────────────────────
  #  检查依赖包是否有已知 CVE 漏洞
  #  先作为建议级，了解现状后再决定是否升级为阻塞级
  # ========================================================================
  pip-audit:
    name: "Dependency audit (advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pip-audit
        run: |
          echo "=== 依赖漏洞扫描（建议级，不阻塞合并）==="
          echo "检查依赖包是否有已知 CVE 漏洞..."
          echo ""
          pip-audit --desc on --format columns || true
          echo ""
          echo "📊 以上为依赖漏洞扫描结果，不阻塞 PR 合并"
