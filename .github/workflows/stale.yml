# ==============================================================================
#  CI：Stale Issue / PR 自动管理
# ==============================================================================
#  触发时机：
#    · 每天凌晨 2 点（北京时间）自动运行
#    · 手动触发
#  功能：
#    · 标记长期无活动的 issue / PR 为 stale
#    · stale 后 7 天仍无活动则自动关闭
#    · 带标签的 issue / PR 豁免（bug / enhancement / 等重要标签）
# ==============================================================================

name: Stale Management

on:
  schedule:
    # 每天北京时间 02:00 = UTC 18:00（前一天）
    - cron: "0 18 * * *"
  workflow_dispatch:

# 最小权限原则
permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: "Mark & close stale items"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository_owner != ''  # 只在有 owner 的仓库运行（fork 不跑）

    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629  # v10
        with:
          # ── 全局配置 ──────────────────────────────────────
          days-before-stale: 30
          days-before-close: 7
          operations-per-run: 100
          remove-stale-when-updated: true
          enable-statistics: true

          # ── 标签 ──────────────────────────────────────────
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-all-milestones: true

          # ── Issue 配置 ────────────────────────────────────
          stale-issue-message: |
            👋 这个 issue 已经 30 天没有活动了，自动标记为 **stale**。

            如果没有进一步活动，将在 7 天后自动关闭。
            如果这个问题仍然重要，请：
            - 添加一条评论说明当前状态
            - 或者移除 `stale` 标签

            感谢你的贡献 🙏

          close-issue-message: |
            🔒 这个 issue 因长期无活动已自动关闭。

            如果你认为这个问题仍然存在或需要继续讨论，请：
            - 重新打开这个 issue
            - 或者创建新的 issue 并引用此 issue

          # 豁免标签（带这些标签的 issue 不会被标记 stale）
          exempt-issue-labels: "bug,enhancement,help wanted,good first issue,security,roadmap,feature"

          # ── PR 配置 ───────────────────────────────────────
          stale-pr-message: |
            👋 这个 PR 已经 30 天没有活动了，自动标记为 **stale**。

            如果没有进一步活动，将在 7 天后自动关闭。
            如果你还在继续工作，请：
            - 添加一条评论说明进展
            - 或者将 PR 标记为 draft
            - 或者移除 `stale` 标签

            感谢你的贡献 🙏

          close-pr-message: |
            🔒 这个 PR 因长期无活动已自动关闭。

            如果你想继续这个工作，可以随时重新打开或新建 PR。
            欢迎随时回来继续贡献 🙌

          # 豁免标签（带这些标签的 PR 不会被标记 stale）
          exempt-pr-labels: "WIP,work-in-progress,do-not-merge,security,feature"

          # ── 其他 ──────────────────────────────────────────
          # draft PR 不标记 stale（作者可能还在写）
          exempt-draft-pr: true
