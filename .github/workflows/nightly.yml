# ==============================================================================
#  Nightly：夜间全量测试 + 性能基准
# ==============================================================================
#  触发时机：
#    · 每天凌晨 3 点（北京时间）自动运行
#    · 手动触发
#  覆盖范围：
#    · 全量测试（含集成、属性、基准）
#    · 性能基准测试（与历史基线对比）
#    · 不稳定测试检测（--retry）
# ==============================================================================

name: Nightly Full Test

on:
  schedule:
    # 每天北京时间 03:00 = UTC 19:00（前一天）
    - cron: "0 19 * * *"

  workflow_dispatch:
    inputs:
      run_perf:
        description: "运行性能基准"
        required: false
        default: true
        type: boolean
      flake_check:
        description: "不稳定测试检测（重跑2次）"
        required: false
        default: false
        type: boolean

# 并发控制：同一分支只保留最新一次夜间运行
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：只授予必要的 GITHUB_TOKEN 权限
permissions:
  contents: read      # 代码检出
  actions: write      # 缓存读写（pip cache）

jobs:
  # ── 全量测试 ────────────────────────────────────────────────────────────
  full-test:
    name: "Full test · Py ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}

      - name: Determine retry count
        id: retry
        run: |
          if [ "${{ github.event.inputs.flake_check }}" = "true" ]; then
            echo "count=2" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Run all tests
        run: |
          python run_tests.py all \
            --junit test-results/full-py${{ matrix.python-version }}.xml \
            --slow 2000 \
            --retry ${{ steps.retry.outputs.count }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: nightly-test-py${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 90

  # ── 性能基准 ────────────────────────────────────────────────────────────
  performance:
    name: "Performance baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event.inputs.run_perf == 'true'
    needs: full-test

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1  # 浅克隆，加速拉取

      - name: Setup Python and deps
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"

      - name: Run performance benchmarks
        id: perf
        run: |
          echo "=== 性能基准测试 ==="
          python run_tests.py performance
          echo ""
          echo "perf_done=true" >> $GITHUB_OUTPUT

      - name: Upload perf data
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: nightly-performance
          path: tests/_perf_baseline.json
          if-no-files-found: ignore
          retention-days: 90

  # ── 汇总报告 ────────────────────────────────────────────────────────────
  summary:
    name: "Nightly summary"
    runs-on: ubuntu-latest
    if: always()
    needs: [full-test, performance]

    steps:
      - name: Generate summary
        run: |
          echo "# 🌙 夜间测试报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **日期**: $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "- **全量测试**: ${{ needs.full-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **性能基准**: ${{ needs.performance.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "详细结果见各 job 的 Artifacts。" >> $GITHUB_STEP_SUMMARY
