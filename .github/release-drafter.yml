# ==============================================================================
#  Release Drafter 配置
# ==============================================================================
#  自动根据 PR 标题（Conventional Commits）分类生成发布日志
#  文档：https://github.com/release-drafter/release-drafter
# ==============================================================================

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# 版本号自动递增规则（基于 PR label）
version-resolver:
  major:
    labels:
      - "major"
      - "breaking-change"
  minor:
    labels:
      - "feat"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "fix"
      - "bugfix"
      - "bug"
      - "dependencies"
      - "security"
      - "maintenance"
      - "perf"
      - "refactor"
      - "chore"
  default: patch

# 分类模板（按 PR label 归类）
categories:
  - title: "🚀 新功能"
    labels:
      - "feat"
      - "feature"
      - "enhancement"

  - title: "🐛 Bug 修复"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
      - "regression"

  - title: "⚡ 性能优化"
    labels:
      - "perf"
      - "performance"

  - title: "🔒 安全"
    labels:
      - "security"
      - "vulnerability"

  - title: "♻️ 重构"
    labels:
      - "refactor"
      - "code-quality"

  - title: "🧪 测试"
    labels:
      - "test"
      - "testing"

  - title: "👷 CI/CD"
    labels:
      - "ci"
      - "cd"
      - "automation"

  - title: "📦 依赖"
    labels:
      - "dependencies"
      - "deps"
      - "build"

  - title: "📝 文档"
    labels:
      - "docs"
      - "documentation"

  - title: "💄 样式"
    labels:
      - "style"

  - title: "🧹 其他"
    labels:
      - "chore"
      - "misc"
      - "other"

# 如果 PR 没有匹配的 label，按 PR 标题前缀猜测
category-template: "### $TITLE"

# 每个 PR 的显示格式
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"

# 没有任何改动时显示
no-changes-template: "暂无显著变更"

# 排除的 PR 标签（不列入发布日志）
exclude-labels:
  - "skip-changelog"
  - "no-release-notes"

# 替换标题格式（美化 PR 标题显示，去掉 type 前缀）
replacers:
  - search: '/^(feat|fix|perf|refactor|style|docs|test|ci|build|chore|revert)(\([^)]+\))?!?: /i'
    replace: ''

# ── 发布日志模板 ──────────────────────────────────────────────────
template: |
  ## 📦 v$RESOLVED_VERSION

  ### 本版本概览

  $CHANGES

  ---

  ## 🔐 供应链安全

  本版本附带软件物料清单（SBOM）与漏洞扫描报告，可在下方 **Assets** 中下载：

  | 文件 | 说明 |
  |---|---|
  | `sbom-futures-orderflow.spdx.json` | SBOM（SPDX 2.3 格式） |
  | `sbom-futures-orderflow.cyclonedx.json` | SBOM（CycloneDX 1.5 格式） |
  | `grype-futures-orderflow.json` | Grype 漏洞扫描报告（JSON） |
  | `sbom-futures-orderflow.sha256` | SHA256 校验和 |

  **验证完整性**：
  ```bash
  sha256sum -c sbom-futures-orderflow.sha256
  ```

  **漏洞扫描状态**：发布前已通过 Grype 扫描（高危 & 严重级别有修复版本的漏洞为零）

  ---

  ## 📋 完整变更

  **对比范围**：[$PREVIOUS_TAG...v$RESOLVED_VERSION](https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION)

  **贡献者**：$CONTRIBUTORS

  ---

  > 💡 本发布日志由 [Release Drafter](https://github.com/release-drafter/release-drafter) 自动生成
  > 📦 SBOM 与漏洞报告由 [Syft](https://github.com/anchore/syft) + [Grype](https://github.com/anchore/grype) 生成
