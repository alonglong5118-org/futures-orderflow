# ==============================================================================
#  Release Drafter 配置
# ==============================================================================
#  自动根据 PR 标题（Conventional Commits）分类生成发布日志
#  文档：https://github.com/release-drafter/release-drafter
# ==============================================================================

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# 版本号自动递增规则（基于 PR type）
version-resolver:
  major:
    labels:
      - "major"
      - "breaking-change"
  minor:
    labels:
      - "enhancement"
      - "feature"
  patch:
    labels:
      - "bug"
      - "bugfix"
      - "fix"
      - "dependencies"
      - "security"
      - "maintenance"
  default: patch

# 分类模板（按 PR label 归类）
categories:
  - title: "🚀 新功能"
    labels:
      - "feat"
      - "feature"
      - "enhancement"

  - title: "🐛 Bug 修复"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
      - "regression"

  - title: "⚡ 性能优化"
    labels:
      - "perf"
      - "performance"

  - title: "🔒 安全"
    labels:
      - "security"
      - "vulnerability"

  - title: "♻️ 重构"
    labels:
      - "refactor"
      - "code-quality"

  - title: "🧪 测试"
    labels:
      - "test"
      - "testing"

  - title: "👷 CI/CD"
    labels:
      - "ci"
      - "cd"
      - "automation"

  - title: "📦 依赖"
    labels:
      - "dependencies"
      - "deps"
      - "build"

  - title: "📝 文档"
    labels:
      - "docs"
      - "documentation"

  - title: "💄 样式"
    labels:
      - "style"

  - title: "🧹 其他"
    labels:
      - "chore"
      - "misc"
      - "other"

# 如果 PR 没有匹配的 label，按 PR 标题前缀猜测
category-template: "### $TITLE"

# 每个 PR 的显示格式
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"

# 没有任何改动时显示
no-changes-template: "暂无显著变更"

# 排除的 PR 标签（不列入发布日志）
exclude-labels:
  - "skip-changelog"
  - "no-release-notes"
  - "dependencies"  # 依赖更新在"依赖"分类中显示，这里不排除

# 替换标题格式（美化 PR 标题显示）
replacers:
  - search: '/^(feat|fix|perf|refactor|style|docs|test|ci|build|chore|revert)(\([^)]+\))?!?: /i'
    replace: ''

# ── 发布日志模板 ──────────────────────────────────────────────────
template: |
  ## 变更概览

  $CHANGES

  ---

  **完整变更对比**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  **贡献者**: $CONTRIBUTORS

  > 💡 本发布日志由 [Release Drafter](https://github.com/release-drafter/release-drafter) 自动生成
