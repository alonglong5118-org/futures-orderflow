# ── 代码类型标签 ──────────────────────────────────────────────────

"tests":
  - any: ["tests/**/*"]

"documentation":
  - any: ["**/*.md", "docs/**/*"]

"ci":
  - any: [".github/**/*"]

"dependencies":
  - any: ["requirements*.txt", "pyproject.toml", "Pipfile*", "poetry.lock"]

# ── 规模标签（size/* 由 pr-automation.yml 处理） ──────────────────
# 注意：size/* 标签在 pr-automation.yml 中通过 JS 计算，
#      labeler 不处理 size 标签，避免冲突
