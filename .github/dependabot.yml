# ==============================================================================
#  Dependabot 配置 —— 依赖自动更新
# ==============================================================================
#  策略：
#    · 每周一早 9 点（北京时间）统一检查，避免频繁打扰
#    · 同类依赖分组升级，减少 PR 数量
#    · 核心依赖主版本升级需人工评审，小版本/补丁自动 PR
#    · GitHub Actions 单独跟踪
#
#  包含生态：
#    · pip            — Python 依赖（requirements.txt + requirements-dev.txt）
#    · github-actions — GitHub Actions 版本更新
# ==============================================================================

version: 2

updates:
  # ── Python 依赖 ──────────────────────────────────────────────────
  #  Dependabot 会自动检测目录下的所有 requirements*.txt 文件
  #  包括 requirements.txt 和 requirements-dev.txt
  # ========================================================================
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"

    # 最多同时开 5 个依赖 PR，避免堆积
    open-pull-requests-limit: 5

    # 自动 rebase（有冲突时自动更新）
    rebase-strategy: "auto"

    # 版本范围：只升级次要版本和补丁，主版本需人工确认
    # （可通过 ignore 规则对特定包进一步限制）
    allow:
      - dependency-type: "all"

    labels:
      - "dependencies"

    # PR 提交信息
    commit-message:
      prefix: "deps"
      include: "scope"

    # ── 分组策略：同类依赖合并 PR，减少噪音 ────────────────────────
    groups:
      # 核心数值计算依赖（一起升级，避免版本不兼容）
      core-numerical:
        patterns:
          - "numpy"
          - "pandas"
          - "scipy"
        update-types:
          - "minor"
          - "patch"

      # 数据科学 / 机器学习
      ml-packages:
        patterns:
          - "hmmlearn"
          - "scikit-*"
          - "xgboost"
          - "lightgbm"
        update-types:
          - "minor"
          - "patch"

      # 可视化
      visualization:
        patterns:
          - "plotly"
          - "matplotlib"
          - "seaborn"
          - "kaleido"
        update-types:
          - "minor"
          - "patch"

      # 数据获取 / API
      data-api:
        patterns:
          - "tqsdk"
          - "akshare"
          - "tushare"
          - "baostock"
          - "requests"
          - "aiohttp"
        update-types:
          - "minor"
          - "patch"

      # 工具类（小版本/补丁自动合并）
      utility-packages:
        patterns:
          - "tqdm"
          - "deap"
          - "pyyaml"
          - "click"
          - "rich"
          - "loguru"
          - "python-dateutil"
          - "pytz"
        update-types:
          - "minor"
          - "patch"

      # 代码质量工具（dev）
      code-quality-tools:
        patterns:
          - "ruff"
          - "mypy"
          - "bandit"
          - "pip-audit"
          - "actionlint"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      # 测试工具（dev）
      testing-tools:
        patterns:
          - "coverage"
          - "pytest"
          - "pytest-*"
          - "hypothesis"
          - "pre-commit"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

    # ── 忽略规则：某些依赖不自动升级 ────────────────────────────────
    ignore:
      # 核心数值库主版本升级需人工评审（破坏性大）
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-major"]

      # 行情 API 主版本需人工确认（接口可能变动）
      - dependency-name: "tqsdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "akshare"
        update-types: ["version-update:semver-major"]

      # plotly 主版本通常有重大变更
      - dependency-name: "plotly"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions 更新 ────────────────────────────────────────────────
  #  自动检查所有 workflow 中引用的 action 版本
  # ========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"

    open-pull-requests-limit: 5
    rebase-strategy: "auto"

    labels:
      - "dependencies"
      - "ci"

    commit-message:
      prefix: "deps-gha"
      include: "scope"

    groups:
      # GitHub 官方 actions 一起升级（通常稳定）
      github-official:
        patterns:
          - "actions/*"
          - "github/*"
        update-types:
          - "minor"
          - "patch"

      # 代码质量相关 actions
      code-quality-actions:
        patterns:
          - "ruffle/*"
          - "codecov/*"
          - "gitleaks/*"
          - "PyCQA/*"
        update-types:
          - "minor"
          - "patch"

      # 安全相关 actions
      security-actions:
        patterns:
          - "release-drafter/*"
          - "actions/labeler"
        update-types:
          - "minor"
          - "patch"
