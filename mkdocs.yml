# MkDocs 配置文件
# 用法:
#   mkdocs serve      # 本地预览
#   mkdocs build      # 构建静态站点
#   mkdocs gh-deploy  # 部署到 GitHub Pages

site_name: Futures OrderFlow · 期货订单流策略系统
site_description: 基于订单流数据的多维度期货量化交易策略框架
site_author: alonglong5118-org
site_url: ""

repo_name: alonglong5118-org/futures-orderflow
repo_url: https://github.com/alonglong5118-org/futures-orderflow
edit_uri: edit/main/docs/

# ──────────────────────────────────────────────────────────
#  主题：Material for MkDocs
# ──────────────────────────────────────────────────────────
theme:
  name: material
  language: zh

  # 配色
  palette:
    # 日间模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到夜间模式
    # 夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到日间模式

  # 字体
  font:
    text: Roboto
    code: Roboto Mono

  # Favicon & Logo
  favicon: assets/favicon.svg
  logo: assets/logo.svg

  # 特性开关
  features:
    - navigation.tabs              # 顶部导航标签
    - navigation.tabs.sticky       # 滚动时保持标签可见
    - navigation.indexes           # 章节可直接链接到 index
    - navigation.sections          # 可折叠章节
    - navigation.expand            # 默认展开左侧导航
    - navigation.path              # 面包屑导航
    - navigation.top               # 回到顶部按钮
    - navigation.footer            # 上一页/下一页
    - navigation.instant           # 即时加载（SPA 体验）
    - navigation.tracking          # URL 锚点跟踪
    - search.suggest               # 搜索建议
    - search.highlight             # 搜索高亮
    - search.share                 # 搜索结果分享
    - content.code.copy            # 代码块复制按钮
    - content.code.select          # 代码块行选择
    - content.code.annotate        # 代码注释
    - content.tabs.link            # 全局标签同步
    - content.tooltips             # 工具提示
    - toc.follow                   # 目录跟随滚动
    - toc.integrate                # 目录集成到侧边栏

  # 图标
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# ──────────────────────────────────────────────────────────
#  插件
# ──────────────────────────────────────────────────────────
plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags
  - glightbox                    # 图片灯箱
  - mkdocs-video                 # 视频嵌入
  - git-revision-date-localized: # 页面更新时间
      type: date
      enable_creation_date: true
      timezone: Asia/Shanghai
      locale: zh

# ──────────────────────────────────────────────────────────
#  Markdown 扩展
# ──────────────────────────────────────────────────────────
markdown_extensions:
  # 基础扩展
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - sane_lists
  - tables
  - toc:
      permalink: true
      toc_depth: 4

  # Python Markdown 扩展
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: alonglong5118-org
      repo: futures-orderflow
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true

# ──────────────────────────────────────────────────────────
#  导航结构
# ──────────────────────────────────────────────────────────
nav:
  - 首页:
    - index.md
    - 快速开始: getting-started/quickstart.md
    - 安装配置: getting-started/installation.md
  - 架构设计:
    - architecture/overview.md
    - 四维策略: architecture/four-dim-strategy.md
    - 风控体系: architecture/risk-management.md
    - 方向源监控: architecture/direction-monitor.md
  - 核心模块:
    - modules/signal-trigger.md
    - modules/risk-gate.md
    - modules/kelly-factor.md
    - modules/price-protection.md
    - modules/gap-stop.md
    - modules/take-profit.md
    - modules/corr-gate.md
    - modules/hidden-pivot.md
    - modules/t-score.md
    - modules/anomaly-scan.md
    - modules/consistency-watchdog.md
  - 测试与质量:
    - testing/overview.md
    - testing/test-framework.md
    - testing/coverage.md
    - testing/regression.md
  - 开发指南:
    - dev-guide/contributing.md
    - dev-guide/commit-conventions.md
    - dev-guide/ci-cd.md
    - dev-guide/code-style.md
    - dev-guide/docker-deploy.md
  - API 参考:
    - reference/api.md
  - 资源:
    - resources/faq.md
    - resources/roadmap.md
    - resources/security.md
    - resources/changelog.md

# ──────────────────────────────────────────────────────────
#  验证设置（构建时检查链接/锚点/缺失文件）
# ──────────────────────────────────────────────────────────
validation:
  nav:
    omitted_files: warn       # docs 中存在但未在 nav 列出的文件 → 警告
    not_found: warn           # nav 中引用但不存在的文件 → 警告
    absolute_links: warn      # nav 中的绝对链接 → 警告
  links:
    not_found: warn           # 死链接 → 警告
    absolute_links: ignore    # 外部绝对链接 → 忽略
    unrecognized_links: ignore # 无法识别的链接格式 → 忽略
    anchors: warn             # 锚点不存在 → 警告

# ──────────────────────────────────────────────────────────
#  额外配置
# ──────────────────────────────────────────────────────────
extra:
  # 社交链接
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alonglong5118-org/futures-orderflow
    - icon: fontawesome/solid/code
      link: https://github.com/alonglong5118-org

  # 版本信息
  version:
    provider: mike

  # 分析（可选，留空占位）
  analytics:
    provider: ""

  # 版权
  copyright: Copyright &copy; 2026 alonglong5118-org · MIT License

  # 生成器隐藏（更干净）
  generator: false

# ──────────────────────────────────────────────────────────
#  额外 CSS / JS
# ──────────────────────────────────────────────────────────
extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

# ──────────────────────────────────────────────────────────
#  监控与验证
# ──────────────────────────────────────────────────────────
watch:
  - docs
